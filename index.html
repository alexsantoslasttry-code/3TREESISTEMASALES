/* ---------- telas ---------- */
function telaProspeccao(){ const gerir=podeGerir(); const abas=[['lista','Minha lista'],...(gerir?[['campanhas','Campanhas'],['painel','Painel da campanha'],['importar','Importar base'],['dnc','Não contatar']]:[])];
  let f=S.aba.pr||'lista'; if(!abas.some(a=>a[0]===f)) f='lista';
  const corpo = f==='campanhas'?telaCampanhas():f==='painel'?painelCampanha():f==='importar'?telaImportar():f==='dnc'?telaDNC():telaMinhaLista();
  return `<div class="pagehead"><div><h1>Prospecção ativa</h1><p class="muted">Cada pessoa vê só os leads atribuídos a ela. Não há exportação da base: o trabalho e o histórico ficam aqui.</p></div></div>
  <div class="tabs">${abas.map(([k,n])=>`<button data-aba="pr:${k}" class="${f===k?'on':''}">${n}</button>`).join('')}</div>${corpo}`; }
function telaMinhaLista(){ const fl=S.aba.prf||'abertos'; const agora=Date.now();
  let ps=lista('prospect').filter(p=>p.responsavelId===eu() && visivelProspect(p));
  const conta={abertos:ps.filter(p=>PROS_ABERTOS.includes(p.status)).length, retorno:ps.filter(p=>p.proximoRetorno && new Date(p.proximoRetorno).getTime()<=agora && PROS_ABERTOS.includes(p.status)).length, encerrados:ps.filter(p=>!PROS_ABERTOS.includes(p.status)).length};
  ps = fl==='retorno'?ps.filter(p=>p.proximoRetorno && new Date(p.proximoRetorno).getTime()<=agora && PROS_ABERTOS.includes(p.status)) : fl==='encerrados'?ps.filter(p=>!PROS_ABERTOS.includes(p.status)) : ps.filter(p=>PROS_ABERTOS.includes(p.status));
  ps.sort((a,b)=>(a.proximoRetorno?new Date(a.proximoRetorno).getTime():Infinity)-(b.proximoRetorno?new Date(b.proximoRetorno).getTime():Infinity) || a.numero.localeCompare(b.numero));
  return `<div class="tabs" style="margin-top:0">${[['abertos','Para trabalhar'],['retorno','Retornos vencidos'],['encerrados','Convertidos e encerrados']].map(([k,n])=>`<button data-aba="prf:${k}" class="${fl===k?'on':''}">${n} (${conta[k]})</button>`).join('')}</div>
  ${ps.length?`<div class="tablewrap"><table class="cards" id="minhaLista"><thead><tr><th>Lead</th><th>Nome</th><th>Empresa</th><th>Contato</th><th>Campanha</th><th>Status</th><th>Tentativas</th><th>Próximo retorno</th><th></th></tr></thead><tbody>${ps.map(p=>{ const venc=p.proximoRetorno&&new Date(p.proximoRetorno).getTime()<=agora&&PROS_ABERTOS.includes(p.status);
    return `<tr><td><a href="#/r/${p.id}" class="num">${venc?'<span class="dot"></span>':''}${esc(p.numero)}</a></td><td>${esc(p.nome)}</td><td>${esc(p.empresa||'—')}</td><td>${esc(p.telefone||'')}${p.email?'<div class="small muted">'+esc(p.email)+'</div>':''}</td><td>${esc(get(p.campanhaId)?.nome||'')}</td><td>${chipStatus(p.status)}</td><td>${(p.tentativas||[]).length}</td><td>${p.proximoRetorno?fmtData(p.proximoRetorno):'—'}</td>
    <td>${PROS_ABERTOS.includes(p.status)?`<button class="btn small" data-act="${p.id}:tentativa">Registrar contato</button>`:''}</td></tr>`; }).join('')}</tbody></table></div>`:'<div class="panel empty">Nenhum lead aqui. O supervisor distribui os leads das campanhas.</div>'}`; }
function telaCampanhas(){ const cs=campanhasVisiveis();
  return `<p><button class="btn primary" data-pros="campanha">Nova campanha</button></p>${cs.length?`<div class="tablewrap"><table class="cards"><thead><tr><th>Campanha</th><th>Produto</th><th>Origem da base</th><th>Base legal</th><th>Leads</th><th>Sem responsável</th><th>Status</th><th></th></tr></thead><tbody>${cs.map(c=>{ const ps=lista('prospect').filter(p=>p.campanhaId===c.id);
    return `<tr><td><b>${esc(c.nome)}</b><div class="small muted">${esc(unidade(c.unidadeId)?.nome||'')} · resp. ${esc(nomeP(c.responsavelId))}</div></td><td>${esc(produto(c.produtoId)?.nome||'—')}</td><td class="small">${esc(c.origemBase)}</td><td class="small">${esc(c.baseLegal)}</td><td>${ps.length}</td><td>${ps.filter(p=>!p.responsavelId&&p.status==='novo').length}</td><td>${chipStatus(c.status)}</td>
    <td class="actions">${c.status==='ativa'?`<button class="btn small" data-pros="lead:${c.id}">Cadastrar lead</button><button class="btn small" data-pros="distribuir:${c.id}">Distribuir</button><button class="btn small" data-pros="redistribuir:${c.id}">Redistribuir carteira</button><button class="btn small" data-pros="encerrar:${c.id}">Encerrar</button>`:''}</td></tr>`; }).join('')}</tbody></table></div>`:'<div class="panel empty">Nenhuma campanha. Crie a primeira informando a origem da base e a base legal.</div>'}`; }
function painelCampanha(){ const cs=campanhasVisiveis(); const cid=S.aba.prc && cs.some(c=>c.id===S.aba.prc) ? S.aba.prc : cs[0]?.id; if(!cid) return '<div class="panel empty">Nenhuma campanha.</div>';
  const ps=lista('prospect').filter(p=>p.campanhaId===cid); const agora=Date.now();
  const tent=ps.reduce((a,p)=>a+(p.tentativas||[]).length,0); const contatados=ps.filter(p=>(p.tentativas||[]).some(t=>['contatado','interessado','follow_up','nao_interessado','nao_contatar'].includes(t.resultado))).length;
  const interessados=ps.filter(p=>['interessado','proposta','venda'].includes(p.status)||(p.tentativas||[]).some(t=>t.resultado==='interessado')).length; const propostas=ps.filter(p=>['proposta','venda'].includes(p.status)).length; const vendas=ps.filter(p=>p.status==='venda').length;
  const distribuidos=ps.filter(p=>p.responsavelId).length; const conv=distribuidos?Math.round(vendas/distribuidos*1000)/10:0; const pend=ps.filter(p=>p.proximoRetorno&&new Date(p.proximoRetorno).getTime()<=agora&&PROS_ABERTOS.includes(p.status));
  const fat=ps.filter(p=>p.status==='venda').reduce((a,p)=>a+(get(p.pedidoId)?.preco||0),0);
  const porV={}; ps.filter(p=>p.responsavelId).forEach(p=>{ const x=porV[p.responsavelId] ||= {a:0,t:0,c:0,i:0,pp:0,v:0,f:0}; x.a++; x.t+=(p.tentativas||[]).length; if((p.tentativas||[]).some(t=>t.resultado!=='nao_respondeu'&&t.resultado!=='invalido')) x.c++; if(['interessado','proposta','venda'].includes(p.status)) x.i++; if(['proposta','venda'].includes(p.status)) x.pp++; if(p.status==='venda') x.v++; if(pend.includes(p)) x.f++; });
  const k=(v,t)=>`<div class="kpi"><b>${v}</b><span>${t}</span></div>`;
  return `<form class="actions" style="margin-bottom:12px"><label class="small" for="selCamp">Campanha</label><select id="selCamp">${cs.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.nome)}</option>`).join('')}</select></form>
  <div class="kpis">${k(ps.length,'Leads na campanha')}${k(distribuidos,'Distribuídos')}${k(tent,'Tentativas')}${k(contatados,'Contatos efetivos')}${k(interessados,'Interessados')}${k(propostas,'Propostas')}${k(vendas,'Vendas')}${k(String(conv).replace('.',',')+'%','Conversão (vendas ÷ distribuídos)')}${k(pend.length,'Follow-ups pendentes')}${k(brl(fat),'Faturamento da campanha')}</div>
  <section class="panel"><h2>Produtividade por vendedor</h2>${Object.keys(porV).length?`<div class="tablewrap"><table><thead><tr><th>Vendedor</th><th>Atribuídos</th><th>Tentativas</th><th>Contatos</th><th>Interessados</th><th>Propostas</th><th>Vendas</th><th>Conversão</th><th>Retornos vencidos</th></tr></thead><tbody>${Object.entries(porV).map(([v,x])=>`<tr><td>${esc(nomeP(v))}</td><td>${x.a}</td><td>${x.t}</td><td>${x.c}</td><td>${x.i}</td><td>${x.pp}</td><td>${x.v}</td><td>${x.a?String(Math.round(x.v/x.a*1000)/10).replace('.',','):0}%</td><td>${x.f?'<span class="chip bad">'+x.f+'</span>':'0'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhum lead distribuído.</p>'}</section>
  <section class="panel" style="margin-top:12px"><h2>Resultado dos leads</h2><p class="small">${Object.entries(ps.reduce((a,p)=>(a[p.status]=(a[p.status]||0)+1,a),{})).map(([s,n])=>`${esc(STATUS[s]||s)}: <b>${n}</b>`).join(' · ')||'—'}</p></section>`; }
function telaImportar(){ const cs=campanhasVisiveis().filter(c=>c.status==='ativa'); const imps=lista('importacao').filter(i=>cs.some(c=>c.id===i.campanhaId)||S.sess.papel==='administrador').sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));

  <h2 style="margin:16px 0 8px">Importações registradas</h2>${imps.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Campanha</th><th>Arquivo</th><th>Por</th><th>Total</th><th>Importados</th><th>Duplicados</th><th>Não contatar</th><th>Inválidos</th><th>Já clientes</th></tr></thead><tbody>${imps.map(i=>`<tr><td>${fmtData(i.criadoEm)}</td><td>${esc(get(i.campanhaId)?.nome||'')}</td><td>${esc(i.arquivo)}</td><td>${esc(nomeP(i.criadoPor))}</td><td>${i.total}</td><td>${i.importados}</td><td>${i.duplicados}</td><td>${i.naoContatar}</td><td>${i.invalidos+(i.proibidos||0)}</td><td>${i.jaClientes}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhuma importação.</p>'}`; }
function telaDNC(){ const ds=lista('dnc').filter(d=>S.sess.papel==='administrador'||!S.sess.unidadeId||!d.unidadeId||d.unidadeId===S.sess.unidadeId);
  return `<p><button class="btn" data-pros="dnc">Adicionar a Não contatar</button></p><p class="small muted">Vale para todas as campanhas: a importação ignora esses contatos e o registro de nova abordagem é bloqueado.</p>

        clienteExistenteId:cli?.id||null,status:v.resp?'distribuido':'novo',responsavelId:v.resp||null,setor:'comercial',tentativas:[],distribuicoes:v.resp?[{para:v.resp,por:eu(),em:agoraISO()}]:[]},'Cadastro manual'); return 'Lead '+p.numero+' cadastrado'+(cli?' (já é cliente '+cli.numero+')':''); }}); },

function detalhesExtraProspect(r){ if(r.tipo!=='prospect') return '';
  const t=r.tentativas||[]; const ex=r.clienteExistenteId?get(r.clienteExistenteId):null;
  return `${ex&&!r.clienteId?`<div class="alert info">Já é cliente: <a href="#/r/${ex.id}">${esc(ex.numero)} ${esc(ex.nome)}</a>. Na conversão o cadastro será reaproveitado.</div>`:''}${naoContatar(r.telefone,r.email)?'<div class="alert bad">Contato na lista Não contatar.</div>':''}
  <h2 style="margin-bottom:8px">Histórico de contatos</h2>${t.length?`<div class="tablewrap"><table><thead><tr><th>Data/hora</th><th>Vendedor</th><th>Canal</th><th>Contato</th><th>Resultado</th><th>Observação</th><th>Próxima ação</th></tr></thead><tbody>${t.slice().reverse().map(x=>`<tr><td>${fmtData(x.em)}</td><td>${esc(nomeP(x.por))}</td><td>${esc(x.canal)}</td><td>${esc(x.contato)}</td><td>${esc(RESULTADOS.find(z=>z[0]===x.resultado)?.[1]||x.resultado)}</td><td>${esc(x.obs||'')}</td><td>${x.proxima?fmtData(x.proxima):'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhum contato registrado.</p>'}
  ${(r.distribuicoes||[]).length?`<h2 style="margin:14px 0 8px">Distribuição</h2><ol class="timeline">${r.distribuicoes.map(d=>`<li><div class="when">${fmtData(d.em)} · por ${esc(nomeP(d.por))}</div><div>${d.de?esc(nomeP(d.de))+' → ':''}<b>${esc(nomeP(d.para))}</b>${d.motivo?' — '+esc(d.motivo):''}</div></li>`).join('')}</ol>`:''}`; }
function fatosProspect(r,f){ if(r.tipo!=='prospect') return; f('Campanha',esc(get(r.campanhaId)?.nome||'—')); f('Nome',esc(r.nome)); if(r.empresa) f('Empresa',esc(r.empresa)); f('Telefone',esc(r.telefone||'—')); f('E-mail',esc(r.email||'—')); if(r.regiao) f('Região',esc(r.regiao));
  f('Origem do lead',esc(r.origem||'—')); f('Base legal',esc(r.baseLegal||'—')); f('Tentativas',(r.tentativas||[]).length); f('Próximo retorno',r.proximoRetorno?fmtData(r.proximoRetorno):'—'); if(r.clienteId) f('Cliente',`<a href="#/r/${r.clienteId}">${esc(get(r.clienteId)?.numero)}</a>`); }
document.addEventListener('click', ev=>{ const el=ev.target.closest('[data-pros]'); if(!el) return; try { const [op,id]=el.dataset.pros.split(':'); PROS[op]?.(id); } catch(e){ toast(e.message||String(e)); } });
document.addEventListener('change', ev=>{ if(ev.target.id==='selCamp'){ S.aba.prc=ev.target.value; render(); } });
document.addEventListener('submit', async ev=>{ const f=ev.target; if(f.id!=='impForm') return; ev.preventDefault(); const btn=f.querySelector('button'); btn.disabled=true; btn.textContent='Importando…';
  try { const camp=get(f.camp.value); const arq=f.arq.files[0]; const txt = arq ? await lerArquivo(arq) : f.txt.value; exigir(txt && txt.trim(),'Escolha um arquivo ou cole o CSV.');
    const r=await importarBase(camp, txt, arq?arq.name:'colado no formulário');
    toast(`${r.importados} importado(s) · ${r.duplicados} duplicado(s) · ${r.naoContatar} em Não contatar · ${r.invalidos+r.proibidos} inválido(s) · ${r.jaClientes} já cliente(s)`); render(); }
  catch(e){ toast(e.message||String(e)); btn.disabled=false; btn.textContent='Importar'; } });
</script>

<script>
"use strict";
/* =====================================================================
   FASE 3 — Experiência operacional completa (mesmo sistema, mesmos dados):
   Dashboard por papel em tempo real · Central única de atendimento com
   distribuição e SLA · prioridade · timeline do cliente · trilha de
   auditoria · notificações internas · tarefas e pendências · busca ampliada.
   ===================================================================== */
Object.assign(TIPO_NOME,{tarefa:'Tarefa',notificacao:'Notificação'});
Object.assign(STATUS,{aberta:'Aberta',feita:'Concluída'});
CASOS.push('tarefa');
Object.keys(MENU_I18N).forEach(l=>Object.assign(MENU_I18N[l],{
  dashboard:{en:'Dashboard',pt:'Dashboard',es:'Panel'}[l], tarefas:{en:'Tasks',pt:'Tarefas',es:'Tareas'}[l],
  notificacoes:{en:'Notifications',pt:'Notificações',es:'Notificaciones'}[l], trilha:{en:'Audit trail',pt:'Trilha de auditoria',es:'Auditoría'}[l],
  atendimento:{en:'Service center',pt:'Central de atendimento',es:'Central de atención'}[l]}));

/* ---------- SLA ---------- */
function sla(r){ if(!r.prazo || !aberto(r) || ['resolvido','encerrado'].includes(r.status)) return null;
  const agora=Date.now(), p=new Date(r.prazo).getTime(), ini=new Date(r.prazoDesde||r.criadoEm).getTime(); const resta=p-agora;
  const nivel = resta<0 ? 'bad' : ((agora-ini)/Math.max(1,p-ini)>=0.8 ? 'warn' : 'ok');
  const h=Math.abs(resta)/36e5; const txt=(h<1?Math.round(h*60)+' min':(h<48?Math.round(h)+' h':Math.round(h/24)+' d'));
  return {nivel, texto: resta<0 ? 'vencido há '+txt : 'resta '+txt}; }
const chipSla = r => { const s=sla(r); return s?`<span class="chip ${s.nivel}">${esc(s.texto)}</span>`:'<span class="muted small">—</span>'; };
const PRIO_ORD = {alta:0, media:1, baixa:2};
const prioridadeDe = r => r.prioridade || (r.tipo==='aprovacao'||r.tipo==='externa' ? 'alta' : 'media');
const chipPrio = r => { const p=prioridadeDe(r); return `<span class="chip ${p==='alta'?'bad':(p==='baixa'?'':'info')}">${esc({alta:'Alta',media:'Média',baixa:'Baixa'}[p])}</span>`; };
const ordCentral = (a,b) => { const sa=sla(a), sb=sla(b); const va=sa?.nivel==='bad'?0:1, vb=sb?.nivel==='bad'?0:1; return va-vb || PRIO_ORD[prioridadeDe(a)]-PRIO_ORD[prioridadeDe(b)] || ordPrazo(a,b); };

/* ---------- notificações internas ---------- */
async function notificar(paraIds, texto, ref){ const ids=[...new Set((paraIds||[]).filter(Boolean))].filter(id=>id!==eu() || S.modoSite);
  for(const para of ids){ const n={id:uid(),tipo:'notificacao',para,texto,refId:ref?.id||null,refNumero:ref?.numero||'',lida:false,criadoEm:agoraISO(),atualizadoEm:agoraISO(),por:S.modoSite?null:(eu()||null)};
    try { await S.store.save(n); } catch(e){} } }
const minhasNotificacoes = () => lista('notificacao').filter(n=>n.para===eu()).sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));
const naoLidas = () => minhasNotificacoes().filter(n=>!n.lida).length;
const supervisoresDa = uId => pessoasCom('supervisor', uId).map(p=>p.id);
const pessoasDoSetor = (setor, uId) => { const papel=PAPEL_DO_SETOR[setor]; return papel ? pessoasCom(papel,uId).map(p=>p.id).concat(setor==='operacao'?pessoasCom('back_office',uId).map(p=>p.id):[]) : []; };
async function aposAlterar(antes, depois, acao){ if(!depois || depois.tipo==='notificacao') return;
  const num=depois.numero||TIPO_NOME[depois.tipo]||'';
  if(depois.tipo==='prospect' && ['distribuicao','redistribuicao'].includes(acao)) return; // agrupado na distribuição
  if(depois.responsavelId && depois.responsavelId!==antes?.responsavelId) await notificar([depois.responsavelId], `${num}: você é o responsável agora${depois.assunto?' — '+depois.assunto:''}.`, depois);
  else if(acao==='encaminhamento' && !depois.responsavelId) await notificar(pessoasDoSetor(depois.setor, depois.unidadeId), `${num} chegou na fila de ${SETORES[depois.setor]||depois.setor}.`, depois);
  if(acao==='mensagem_cliente') await notificar(depois.responsavelId?[depois.responsavelId]:supervisoresDa(depois.unidadeId), `${num}: nova mensagem do cliente no chat.`, depois);
  if(acao==='reabertura') await notificar(supervisoresDa(depois.unidadeId).concat(depois.responsavelId?[depois.responsavelId]:[]), `${num} foi reaberto pelo cliente.`, depois);
  if(depois.tipo==='aprovacao' && acao==='decisao') await notificar([depois.solicitanteId], `${depois.numero}: ${STATUS[depois.status]||depois.status}.`, depois);
  if(acao==='tarefa' && JSON.stringify(antes?.tarefas)!==JSON.stringify(depois.tarefas)){ const nova=(depois.tarefas||[]).find(t=>!(antes?.tarefas||[]).some(x=>x.id===t.id)); if(nova) await notificar([nova.responsavelId], `${num}: nova tarefa — ${nova.descricao}.`, depois); } }
async function aposCriar(rec){ if(!rec || rec.tipo==='notificacao') return; const num=rec.numero||'';
  if(rec.tipo==='aprovacao'){ const papel=rec.requer[0]; await notificar(pessoasCom(papel, rec.unidadeId).map(p=>p.id).filter(id=>id!==rec.solicitanteId), `${num}: aprovação aguardando decisão — ${TIPO_AP[rec.tipoAp]}.`, rec); return; }
  if(rec.tipo==='protocolo' && rec.origem==='site') { await notificar(rec.responsavelId?[rec.responsavelId]:pessoasDoSetor(rec.setor, rec.unidadeId).concat(supervisoresDa(rec.unidadeId)), `${num}: novo pedido pelo site.`, rec); return; }
  if(['tarefa','log','conversa','lead','protocolo','externa'].includes(rec.tipo) && rec.responsavelId && rec.responsavelId!==eu()) await notificar([rec.responsavelId], `${num||TIPO_NOME[rec.tipo]}: atribuído a você${rec.titulo?' — '+rec.titulo:''}.`, rec);
  if(rec.tipo==='conversa') await notificar(rec.participantes.filter(p=>p!==eu()), `Nova conversa interna: ${rec.titulo}.`, rec); }
const _alterarBase = alterar;
alterar = async function(rec, mud, acao, opts){ const antes = JSON.parse(JSON.stringify(get(rec.id)||rec)); const r = await _alterarBase(rec, mud, acao, opts); try { await aposAlterar(antes, r, acao); } catch(e){} return r; };
const _criarBase = criar;
criar = async function(tipo, dados, detalhe){ const r = await _criarBase(tipo, dados, detalhe); try { await aposCriar(r); } catch(e){} return r; };
const _distribuirBase = distribuir;
distribuir = async function(camp, vendedores, limite){ const antes=new Set(lista('prospect').filter(p=>p.campanhaId===camp.id&&p.responsavelId).map(p=>p.id)); const n=await _distribuirBase(camp, vendedores, limite);
  for(const v of vendedores){ const k=lista('prospect').filter(p=>p.campanhaId===camp.id&&p.responsavelId===v&&!antes.has(p.id)).length; if(k) await notificar([v], `Você recebeu ${k} lead(s) da campanha ${camp.nome}.`, null); } return n; };
const _redistBase = redistribuirCarteira;
redistribuirCarteira = async function(camp, de, para, motivo){ const n=await _redistBase(camp, de, para, motivo); await notificar([para], `Você recebeu ${n} lead(s) da carteira de ${nomeP(de)} (${camp.nome}).`, null); return n; };

/* ---------- tarefas ---------- */
function visivelTarefa(r){ const s=S.sess; if(!s) return false; if(s.papel==='administrador') return true; if(r.responsavelId===eu()||r.criadoPor===eu()) return true; return can('redistribuir.casos',r) && (!s.unidadeId||!r.unidadeId||r.unidadeId===s.unidadeId); }
function minhasPendencias(){ const me=eu(); const out=[];
  lista('tarefa').filter(t=>t.responsavelId===me && t.status==='aberta').forEach(t=>out.push({origem:'Tarefa',titulo:t.titulo,prazo:t.prazo,prio:t.prioridade,ref:t}));
  lista('pedido').forEach(p=>(p.tarefas||[]).filter(t=>t.responsavelId===me&&t.status!=='concluida').forEach(t=>out.push({origem:'Ordem de Serviço '+(p.os||p.numero),titulo:t.descricao,prazo:t.prazo?t.prazo+'T18:00:00':null,prio:'media',ref:p})));
  lista('protocolo').filter(p=>p.responsavelId===me && aberto(p)).forEach(p=>(p.pendencias||[]).filter(x=>!x.resolvida && x.resp==='equipe').forEach(x=>out.push({origem:'Pendência '+p.numero,titulo:x.texto,prazo:p.prazo,prio:p.prioridade||'media',ref:p})));
  lista('prospect').filter(p=>p.responsavelId===me && PROS_ABERTOS.includes(p.status) && p.proximoRetorno && new Date(p.proximoRetorno).getTime()<=Date.now()+864e5).forEach(p=>out.push({origem:'Retorno de lead',titulo:p.nome+' · '+(p.telefone||p.email),prazo:p.proximoRetorno,prio:'media',ref:p}));
  return out.sort((a,b)=>(a.prazo?new Date(a.prazo).getTime():Infinity)-(b.prazo?new Date(b.prazo).getTime():Infinity)); }
function telaTarefas(){ const f=S.aba.tf||'minhas'; const sup=can('redistribuir.casos')||S.sess.papel==='administrador';
  const abas=[['minhas','Minhas tarefas e pendências'],...(sup?[['equipe','Tarefas da equipe']]:[]),['criadas','Criadas por mim']];
  let corpo='';
  if(f==='minhas'){ const ps=minhasPendencias(); corpo = ps.length?`<div class="tablewrap"><table class="cards"><thead><tr><th>Origem</th><th>O que fazer</th><th>Prazo</th><th>Prioridade</th><th></th></tr></thead><tbody>${ps.map(x=>{ const venc=x.prazo&&new Date(x.prazo).getTime()<Date.now();
    return `<tr><td>${venc?'<span class="dot"></span>':''}${esc(x.origem)}</td><td>${esc(x.titulo)}</td><td>${x.prazo?fmtData(x.prazo):'—'}</td><td>${esc({alta:'Alta',media:'Média',baixa:'Baixa'}[x.prio]||'Média')}</td><td>${x.ref.tipo==='tarefa'?`<button class="btn small" data-tarefa="${x.ref.id}">Concluir</button> `:''}<a class="btn small" href="#/r/${x.ref.id}">Abrir</a></td></tr>`; }).join('')}</tbody></table></div>`:'<div class="panel empty">Nada pendente com você.</div>'; }
  if(f==='equipe'||f==='criadas'){ const ts=lista('tarefa').filter(visivelTarefa).filter(t=>f==='criadas'?t.criadoPor===eu():true).sort((a,b)=>(a.status==='aberta'?0:1)-(b.status==='aberta'?0:1)||String(a.prazo).localeCompare(String(b.prazo)));
    corpo = ts.length?`<div class="tablewrap"><table class="cards"><thead><tr><th>Tarefa</th><th>Responsável</th><th>Prazo</th><th>Prioridade</th><th>Status</th><th>Ligada a</th></tr></thead><tbody>${ts.map(t=>`<tr class="link" data-go="#/r/${t.id}"><td>${esc(t.titulo)}</td><td>${esc(nomeP(t.responsavelId))}</td><td>${t.prazo?fmtData(t.prazo):'—'}</td><td>${esc({alta:'Alta',media:'Média',baixa:'Baixa'}[t.prioridade])}</td><td>${chipStatus(t.status)}</td><td>${t.refId?`<a href="#/r/${t.refId}">${esc(get(t.refId)?.numero||'')}</a>`:'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">Nenhuma tarefa.</div>'; }
  return `<div class="pagehead"><div><h1>Tarefas e pendências</h1><p class="muted">Tudo o que depende de você: tarefas, tarefas de Ordens de Serviço, pendências dos seus protocolos e retornos de leads.</p></div><button class="btn primary" data-novatarefa="1">Nova tarefa</button></div>
  <div class="tabs">${abas.map(([k,n])=>`<button data-aba="tf:${k}" class="${f===k?'on':''}">${n}</button>`).join('')}</div>${corpo}`; }
function formTarefa(pref={}){ abrirForm({titulo:'Nova tarefa', campos:[{tipo:'text',nome:'titulo',rotulo:'Tarefa',obrig:true},{tipo:'textarea',nome:'desc',rotulo:'Detalhes'},
  {tipo:'select',nome:'resp',rotulo:'Responsável',obrig:true,valor:eu(),opcoes:lista('pessoa').filter(p=>p.status==='ativo').map(p=>[p.id,p.nome+' — '+papeisDe(p.id)])},
  {tipo:'date',nome:'prazo',rotulo:'Prazo',obrig:true,valor:new Date(Date.now()+864e5).toISOString().slice(0,10)},{tipo:'select',nome:'prio',rotulo:'Prioridade',obrig:true,valor:'media',vazio:false,opcoes:[['alta','Alta'],['media','Média'],['baixa','Baixa']]},
  {tipo:'select',nome:'ref',rotulo:'Ligada a (opcional)',valor:pref.refId||'',opcoes:casosVisiveis().filter(r=>['protocolo','pedido','lead','cliente'].includes(r.tipo)&&aberto(r)).slice(0,200).map(r=>[r.id,r.numero+' · '+nomeCli(r)])}], ok:'Criar tarefa',
  onSubmit:async v=>{ const ref=v.ref?get(v.ref):null; exigir(v.resp===eu() || can('redistribuir.casos') || S.sess.papel==='administrador','Só supervisor ou administrador atribui tarefa a outra pessoa.');
    const t=await criar('tarefa',{titulo:v.titulo,descricao:v.desc,responsavelId:v.resp,prazo:v.prazo+'T18:00:00',prazoDesde:agoraISO(),prioridade:v.prio,refId:ref?.id||null,unidadeId:ref?.unidadeId||S.sess.unidadeId||null,status:'aberta',setor:null,notas:[]},'Tarefa: '+v.titulo);
    if(ref){ await registrar(ref,'vinculo',{motivo:'tarefa criada',detalhe:v.titulo+' → '+nomeP(v.resp)}); await S.store.save(get(ref.id)||ref); } return 'Tarefa criada'; }}); }
ACOES.tarefa=[
 {id:'concluir', rotulo:'Concluir tarefa', quando:r=>r.status==='aberta' && (r.responsavelId===eu()||can('redistribuir.casos',r)), abrir:r=>COMP_TAREFA(r)},
 {id:'resp', rotulo:'Trocar responsável', quando:r=>r.status==='aberta' && (can('redistribuir.casos',r)||r.criadoPor===eu()), abrir:r=>abrirForm({titulo:'Responsável — '+r.titulo, campos:[{tipo:'select',nome:'p',rotulo:'Responsável',obrig:true,opcoes:lista('pessoa').filter(p=>p.status==='ativo').map(p=>[p.id,p.nome])},{tipo:'text',nome:'motivo',rotulo:'Motivo',obrig:true}], ok:'Salvar',
   onSubmit:async v=>{ await alterar(r,{responsavelId:v.p},'redistribuicao',{motivo:v.motivo,detalhe:'Para '+nomeP(v.p)}); return 'Responsável alterado'; }})},
 {id:'nota', rotulo:'Mensagem interna', quando:r=>true, abrir:r=>formNota(r)}];
const COMP_TAREFA = r => abrirForm({titulo:'Concluir: '+r.titulo, campos:[{tipo:'text',nome:'res',rotulo:'Resultado',obrig:true}], ok:'Concluir',
  onSubmit:async v=>{ await alterar(r,{status:'feita',resultado:v.res,concluidaEm:agoraISO(),prazo:null},'conclusao',{motivo:'tarefa concluída',detalhe:v.res}); if(r.criadoPor && r.criadoPor!==eu()) await notificar([r.criadoPor], `Tarefa concluída: ${r.titulo}.`, r); return 'Tarefa concluída'; }});

/* ---------- prioridade do protocolo ---------- */
ACOES.protocolo.splice(3,0,{id:'prioridade', rotulo:'Alterar prioridade', quando:r=>aberto(r) && r.status!=='resolvido' && (can('protocolo.editar',r)||can('redistribuir.casos',r)),
  abrir:r=>abrirForm({titulo:'Prioridade — '+r.numero, sub:'Atual: '+({alta:'Alta',media:'Média',baixa:'Baixa'}[r.prioridade]||'Média')+(r.primeiraRespostaEm?'':'. Sem primeira resposta: o prazo é recalculado.'), campos:[{tipo:'select',nome:'p',rotulo:'Nova prioridade',obrig:true,vazio:false,valor:r.prioridade,opcoes:[['alta','Alta'],['media','Média'],['baixa','Baixa']]},{tipo:'text',nome:'motivo',rotulo:'Motivo',obrig:true}], ok:'Salvar',
    onSubmit:async v=>{ const mud={prioridade:v.p}; if(!r.primeiraRespostaEm){ mud.prazo=somaHoras(r.criadoEm,prazoH(v.p)); mud.prazoDesde=r.criadoEm; } await alterar(r,mud,'prioridade',{motivo:v.motivo,detalhe:'Prioridade: '+v.p}); return 'Prioridade alterada'; }})});

/* ---------- Central única de atendimento ---------- */
const TIPOS_CENTRAL = [['todos','Tudo'],['protocolo','Protocolos'],['lead','Oportunidades'],['pedido','Pedidos e OS'],['aprovacao','Aprovações'],['externa','Reclamações externas'],['autorizacao','Benefícios'],['tarefa','Tarefas'],['prospect','Leads de prospecção']];
function itensCentral(){ const f=S.aba.cf||{}; const me=eu(); const set=meusSetores(); const q=(f.q||'').toLowerCase().trim(); const d=digitos(q);
  let xs=casosVisiveis().filter(r=>r.tipo!=='simulacao' && r.tipo!=='proposta');
  if(f.tipo && f.tipo!=='todos') xs=xs.filter(r=>r.tipo===f.tipo);
  const grupo=f.grupo||'abertos';
  if(grupo==='abertos') xs=xs.filter(r=>aberto(r)&&r.status!=='resolvido'); else if(grupo==='sem') xs=xs.filter(r=>aberto(r)&&!r.responsavelId&&r.status!=='resolvido');
  else if(grupo==='vencidos') xs=xs.filter(r=>sla(r)?.nivel==='bad'); else if(grupo==='meus') xs=xs.filter(r=>r.responsavelId===me&&aberto(r)); else if(grupo==='setor') xs=xs.filter(r=>aberto(r)&&set.includes(r.setor));
  if(f.setor) xs=xs.filter(r=>r.setor===f.setor); if(f.resp) xs=xs.filter(r=>f.resp==='__sem'?!r.responsavelId:r.responsavelId===f.resp); if(f.prio) xs=xs.filter(r=>prioridadeDe(r)===f.prio);
  if(q) xs=xs.filter(r=>(r.numero||'').toLowerCase().includes(q)||nomeCli(r).toLowerCase().includes(q)||(r.assunto||'').toLowerCase().includes(q)||(d.length>=4&&(digitos(get(r.clienteId)?.telefone).includes(d)||digitos(r.telefone).includes(d))));
  return xs.sort(ordCentral); }
function telaCentral(){ const f=S.aba.cf||{}; const xs=itensCentral(); const sup=can('redistribuir.casos')||S.sess.papel==='administrador';
  const base=casosVisiveis().filter(r=>r.tipo!=='simulacao'&&r.tipo!=='proposta'&&aberto(r)&&r.status!=='resolvido');
  const k=(v,t,cls='')=>`<div class="kpi"><b ${cls&&v!==0?`style="color:var(--${cls})"`:''}>${v}</b><span>${t}</span></div>`;
  const pessoasOp = lista('pessoa').filter(p=>p.status==='ativo'&&atribuicoesDe(p.id).length);
  return `<div class="pagehead"><div><h1>Central de atendimento</h1><p class="muted">Tudo o que está em aberto na operação, num lugar só: protocolos, oportunidades, pedidos e OS, aprovações, benefícios, tarefas e leads. Ordenado por SLA vencido, prioridade e prazo.</p></div>
    <div class="actions"><button class="btn primary" data-proximo="1">Pegar o próximo</button>${can('protocolo.abrir')?'<button class="btn" data-novoprot="1">Abrir protocolo</button>':''}</div></div>
  <div class="kpis">${k(base.length,'Em aberto')}${k(base.filter(r=>!r.responsavelId).length,'Sem responsável','warn')}${k(base.filter(r=>sla(r)?.nivel==='bad').length,'SLA vencido','danger')}${k(base.filter(r=>sla(r)?.nivel==='warn').length,'Vencendo','warn')}${k(base.filter(r=>r.responsavelId===eu()).length,'Comigo')}</div>
  <form id="centralFiltro" class="actions" style="margin-bottom:10px">
    <select name="grupo" aria-label="Situação">${[['abertos','Em aberto'],['sem','Sem responsável'],['vencidos','SLA vencido'],['meus','Comigo'],['setor','Do meu setor'],['todos','Todos, inclusive encerrados']].map(([v,n])=>`<option value="${v}"${(f.grupo||'abertos')===v?' selected':''}>${n}</option>`).join('')}</select>
    <select name="tipo" aria-label="Tipo">${TIPOS_CENTRAL.map(([v,n])=>`<option value="${v}"${(f.tipo||'todos')===v?' selected':''}>${n}</option>`).join('')}</select>
    <select name="setor" aria-label="Setor"><option value="">Todos os setores</option>${Object.entries(SETORES).filter(([s])=>s!=='finalizado').map(([v,n])=>`<option value="${v}"${f.setor===v?' selected':''}>${n}</option>`).join('')}</select>
    <select name="resp" aria-label="Responsável"><option value="">Qualquer responsável</option><option value="__sem"${f.resp==='__sem'?' selected':''}>Sem responsável</option>${pessoasOp.map(p=>`<option value="${p.id}"${f.resp===p.id?' selected':''}>${esc(p.nome)}</option>`).join('')}</select>
    <select name="prio" aria-label="Prioridade"><option value="">Qualquer prioridade</option>${[['alta','Alta'],['media','Média'],['baixa','Baixa']].map(([v,n])=>`<option value="${v}"${f.prio===v?' selected':''}>${n}</option>`).join('')}</select>
    <input name="q" value="${esc(f.q||'')}" placeholder="Número, cliente, telefone, assunto" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:200px"><button class="btn">Filtrar</button></form>
  ${sup?`<form id="centralLote" class="actions" style="margin-bottom:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px"><span class="small"><b id="selCount">0</b> selecionado(s)</span>
    <select name="para" aria-label="Atribuir a"><option value="">Atribuir a…</option>${pessoasOp.map(p=>`<option value="${p.id}">${esc(p.nome)} — ${esc(papeisDe(p.id))}</option>`).join('')}</select><input name="motivo" placeholder="Motivo" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px"><button class="btn">Atribuir selecionados</button>
    <button type="button" class="btn" data-autodist="1" title="Distribui os itens sem responsável entre as pessoas do setor de cada item">Distribuir automaticamente</button></form>`:''}
  ${xs.length?`<div class="tablewrap"><table class="cards" id="tabCentral"><thead><tr>${sup?'<th><input type="checkbox" id="selTodos" aria-label="Selecionar todos"></th>':''}<th>Número</th><th>Tipo</th><th>Cliente / assunto</th><th>Status</th><th>Prioridade</th><th>SLA</th><th>Setor</th><th>Responsável</th></tr></thead><tbody>${xs.slice(0,300).map(r=>`<tr>${sup?`<td><input type="checkbox" class="selItem" value="${r.id}" aria-label="Selecionar ${esc(r.numero||'')}"></td>`:''}<td>${linkRec(r)}</td><td>${esc(TIPO_NOME[r.tipo])}${r.modulo?'<div class="small muted">'+esc(MODULOS[r.modulo]?.nome||'')+'</div>':''}</td><td>${esc(nomeCli(r))}${r.assunto||r.titulo?'<div class="small muted">'+esc(r.assunto||r.titulo)+'</div>':''}</td><td>${chipStatus(r.status)}</td><td>${chipPrio(r)}</td><td>${chipSla(r)}</td><td>${esc(SETORES[r.setor]||'—')}</td><td>${esc(nomeP(r.responsavelId))}</td></tr>`).join('')}</tbody></table></div>${xs.length>300?'<p class="small muted">Mostrando 300 de '+xs.length+'. Refine os filtros.</p>':''}`:'<div class="panel empty">Nada com esses filtros.</div>'}`; }
async function pegarProximo(){ const set=meusSetores(); const cand=casosVisiveis().filter(r=>aberto(r)&&r.status!=='resolvido'&&!r.responsavelId&&set.includes(r.setor)&&['protocolo','lead','pedido','externa','autorizacao','log'].includes(r.tipo)).sort(ordCentral);
  exigir(cand.length,'Nenhum atendimento sem responsável no seu setor.'); const r=cand[0];
  if(r.tipo==='protocolo'){ const a=ACOES.protocolo.find(x=>x.id==='assumir'); exigir(a.quando(r),'Seu papel não pode assumir este caso.'); }
  await alterar(r,{responsavelId:eu(),...(r.tipo==='protocolo'&&['aberto','encaminhado','reaberto'].includes(r.status)?{status:'em_analise'}:{})},'assuncao',{motivo:'pegou o próximo da fila'}); location.hash='#/r/'+r.id; return r; }
async function distribuirAuto(){ exigir(can('redistribuir.casos')||S.sess.papel==='administrador','Só supervisor ou administrador distribui.');
  const xs=itensCentral().filter(r=>!r.responsavelId&&aberto(r)&&r.status!=='resolvido'&&r.tipo!=='aprovacao'); exigir(xs.length,'Nenhum item sem responsável nos filtros atuais.'); const rodizio={}; let n=0;
  for(const r of xs){ const pool=pessoasDoSetor(r.setor, r.unidadeId).filter(id=>id!==eu()||true); if(!pool.length) continue; const k=r.setor+'|'+r.unidadeId; rodizio[k]=(rodizio[k]||0); const para=pool[rodizio[k]++ % pool.length];
    await alterar(r,{responsavelId:para},'distribuicao',{motivo:'distribuição automática da central',detalhe:'Para '+nomeP(para)}); n++; }
  return n; }

/* ---------- Dashboard por papel (em tempo real) ---------- */
function telaDashboard(){ const s=S.sess; const u=s.unidadeId; const noEscopo=r=>!u||!r.unidadeId||r.unidadeId===u; const gestor=can('painel.ver')||s.papel==='administrador';
  const fila=minhaFila(); const pend=minhasPendencias(); const nl=naoLidas(); const k=(v,t,href,cls='')=>`<a class="kpi" href="${href}" style="text-decoration:none;color:inherit"><b ${cls&&v!==0&&v!=='0'?`style="color:var(--${cls})"`:''}>${v}</b><span>${t}</span></a>`;

  <h2 style="margin-bottom:8px">Comigo</h2><div class="kpis">${k(fila.length,'Minha fila','#/fila')}${k(fila.filter(r=>alertas(r).some(a=>a[0]==='bad')).length,'Vencidos na minha fila','#/fila','danger')}${k(pend.length,'Tarefas e pendências','#/tarefas')}${k(nl,'Notificações não lidas','#/notificacoes',nl?'warn':'')}${minhasAprov?k(minhasAprov,'Aprovações aguardando você','#/aprovacoes','warn'):''}${can('prospeccao.trabalhar')?k(lista('prospect').filter(p=>p.responsavelId===eu()&&PROS_ABERTOS.includes(p.status)).length,'Meus leads abertos','#/prospeccao'):''}${can('comissao.ver')?k(brl(lista('comissao').filter(c=>c.vendedorId===eu()&&['prevista','aguardando_confirmacao','liberada'].includes(c.status)).reduce((a,c)=>a+c.valor,0)),'Minhas comissões a receber','#/comissoes'):''}</div>`;
  if(gestor){ const R=lista('protocolo').filter(noEscopo), D=lista('pedido').filter(noEscopo), C=lista('comissao').filter(noEscopo); const abertos=casosVisiveis().filter(r=>noEscopo(r)&&aberto(r)&&r.status!=='resolvido'&&!['simulacao','proposta','prospect'].includes(r.tipo));
    const hoje=new Date().toISOString().slice(0,10), mes=hoje.slice(0,7); const venc=abertos.filter(r=>sla(r)?.nivel==='bad'); const comPrazo=abertos.filter(r=>sla(r)); const dentro=comPrazo.length?Math.round((comPrazo.length-venc.length)/comPrazo.length*100):100;
    const vendasMes=D.filter(p=>p.status!=='cancelado'&&String(p.criadoEm).startsWith(mes)); const fat=vendasMes.filter(p=>(p.moeda||'BRL')==='BRL'&&p.pagamento?.status!=='reembolsado').reduce((a,p)=>a+p.preco,0), fatEUR=vendasMes.filter(p=>p.moeda==='EUR'&&p.pagamento?.status!=='reembolsado').reduce((a,p)=>a+p.preco,0);
    const prod={}; const sete=Date.now()-7*864e5; S.recs.filter(r=>noEscopo(r)&&r.responsavelId).forEach(r=>{ const fim=r.tipo==='protocolo'&&r.resolvidoEm&&new Date(r.resolvidoEm).getTime()>=sete || r.tipo==='pedido'&&['entregue','concluido'].includes(r.status)&&new Date(r.atualizadoEm).getTime()>=sete || r.tipo==='tarefa'&&r.status==='feita'&&new Date(r.concluidaEm).getTime()>=sete; const x=prod[r.responsavelId] ||= {abertos:0,feitos:0,venc:0}; if(aberto(r)&&r.status!=='resolvido'&&!['simulacao','proposta','prospect'].includes(r.tipo)){ x.abertos++; if(sla(r)?.nivel==='bad') x.venc++; } if(fim) x.feitos++; });
    h+=`<h2 style="margin:6px 0 8px">Operação</h2><div class="kpis">${k(abertos.length,'Em aberto','#/atendimento')}${k(abertos.filter(r=>!r.responsavelId).length,'Sem responsável','#/atendimento','warn')}${k(venc.length,'SLA vencido','#/atendimento','danger')}${k(dentro+'%','Dentro do SLA','#/atendimento')}${k(R.filter(p=>String(p.criadoEm).startsWith(hoje)).length,'Atendimentos abertos hoje','#/atendimento')}${k(R.filter(p=>p.resolvidoEm&&String(p.resolvidoEm).startsWith(hoje)).length,'Resolvidos hoje','#/atendimento')}${k(lista('aprovacao').filter(a=>noEscopo(a)&&a.status==='pendente').length,'Aprovações pendentes','#/aprovacoes')}${k(lista('tarefa').filter(t=>noEscopo(t)&&t.status==='aberta').length+lista('protocolo').filter(noEscopo).reduce((a,p)=>a+(p.pendencias||[]).filter(x=>!x.resolvida).length,0),'Tarefas e pendências abertas','#/tarefas')}</div>
    <h2 style="margin:6px 0 8px">Vendas e comissões · ${esc(new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</h2><div class="kpis">${k(vendasMes.length,'Vendas no mês','#/funil')}${k(brl(fat),'Faturamento no mês (R$)','#/painel')}${k(svMoney(fatEUR,'EUR'),'Faturamento no mês (€)','#/painel')}${k(lista('lead').filter(l=>noEscopo(l)&&['novo','em_atendimento','qualificado'].includes(l.status)).length,'Oportunidades abertas','#/funil')}${k(lista('prospect').filter(p=>noEscopo(p)&&PROS_ABERTOS.includes(p.status)).length,'Leads de prospecção abertos','#/prospeccao')}${k(brl(C.filter(c=>['prevista','aguardando_confirmacao'].includes(c.status)).reduce((a,c)=>a+c.valor,0)),'Comissão prevista','#/comissoes')}${k(brl(C.filter(c=>c.status==='liberada').reduce((a,c)=>a+c.valor,0)),'Comissão a pagar','#/comissoes')}</div>
    <div class="grid g2"><section class="panel"><h2>Agir agora</h2>${venc.length?tabelaCasos(venc.sort(ordCentral).slice(0,6)):'<p class="muted">Nada com SLA vencido.</p>'}</section>
    <section class="panel"><h2>Produtividade (7 dias)</h2>${Object.keys(prod).length?`<table><thead><tr><th>Pessoa</th><th>Em aberto</th><th>Vencidos</th><th>Concluídos</th></tr></thead><tbody>${Object.entries(prod).sort((a,b)=>b[1].feitos-a[1].feitos).map(([p,x])=>`<tr><td>${esc(nomeP(p))}</td><td>${x.abertos}</td><td>${x.venc?'<span class="chip bad">'+x.venc+'</span>':'0'}</td><td>${x.feitos}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Sem casos atribuídos.</p>'}</section></div>`; }
  else { h+=`<section class="panel"><h2>Próximos da minha fila</h2>${fila.length?tabelaCasos(fila.slice(0,8)):'<p class="muted">Fila vazia.</p>'}</section>`; }
  const ult=minhasNotificacoes().slice(0,5); if(ult.length) h+=`<section class="panel" style="margin-top:16px"><h2>Últimas notificações</h2>${ult.map(n=>`<p style="margin:6px 0"><a href="javascript:void 0" data-notif="${n.id}" style="${n.lida?'color:var(--muted)':'font-weight:600'}">${esc(n.texto)}</a> <span class="small muted">${fmtData(n.criadoEm)}</span></p>`).join('')}</section>`;
  return h; }

/* ---------- notificações, trilha de auditoria, timeline do cliente ---------- */
function telaNotificacoes(){ const ns=minhasNotificacoes();
  return `<div class="pagehead"><div><h1>Notificações</h1><p class="muted">Avisos internos: casos atribuídos a você, encaminhamentos para o seu setor, aprovações, mensagens de clientes, tarefas e leads recebidos.</p></div>${ns.some(n=>!n.lida)?'<button class="btn" data-notiftodas="1">Marcar todas como lidas</button>':''}</div>
  ${ns.length?`<div class="tablewrap"><table class="cards"><tbody>${ns.map(n=>`<tr class="link" data-notif="${n.id}"><td>${n.lida?'':'<span class="dot" style="background:var(--tree)"></span>'}<span style="${n.lida?'':'font-weight:600'}">${esc(n.texto)}</span></td><td class="small muted">${fmtData(n.criadoEm)}${n.por?' · '+esc(nomeP(n.por)):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="panel empty">Nenhuma notificação.</div>'}`; }
async function abrirNotificacao(id){ const n=get(id); if(!n) return; if(!n.lida){ await S.store.save({...n,lida:true,lidaEm:agoraISO(),atualizadoEm:agoraISO()}); } if(n.refId && get(n.refId)) location.hash='#/r/'+n.refId; else render(); }
function telaTrilha(){ return `<div class="pagehead"><div><h1>Trilha de auditoria</h1><p class="muted">Últimas ações registradas em todo o sistema: quem, o quê, quando, registro e valores anteriores/novos. O histórico é encadeado e não pode ser alterado.</p></div></div>
  <form id="trilhaFiltro" class="actions" style="margin-bottom:10px"><input name="q" value="${esc(S.aba.trq||'')}" placeholder="Pessoa, ação, número ou texto" style="padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:240px"><button class="btn">Filtrar</button></form><div id="trilhaBox"><p class="muted">Carregando…</p></div>`; }
async function carregarTrilha(){ const box=$('#trilhaBox'); if(!box) return; try { const q=(S.aba.trq||'').toLowerCase(); let evs=await S.store.recentEvents(300);
  evs=evs.filter(e=>{ if(S.sess.papel==='administrador') return true; return (!S.sess.unidadeId || !e.unidadeId || e.unidadeId===S.sess.unidadeId); });
  if(q) evs=evs.filter(e=>[nomeP(e.pessoaId),e.acao,e.numero,e.detalhe,e.motivo,PAPEIS[e.papel]].join(' ').toLowerCase().includes(q));
  box.innerHTML = evs.length?`<div class="tablewrap"><table class="cards"><thead><tr><th>Quando</th><th>Quem</th><th>Papel</th><th>Ação</th><th>Registro</th><th>Detalhe</th><th>Antes → depois</th></tr></thead><tbody>${evs.map(e=>`<tr><td class="small">${fmtData(e.em)}</td><td>${e.papel==='cliente_site'?'Cliente (site)':esc(nomeP(e.pessoaId))}</td><td class="small">${esc(PAPEIS[e.papel]||e.papel)}</td><td>${esc(String(e.acao).replace(/_/g,' '))}</td><td>${get(e.ref)?`<a href="#/r/${e.ref}">${esc(e.numero||TIPO_NOME[e.tipo]||'')}</a>`:esc(e.numero||TIPO_NOME[e.tipo]||'')}</td><td class="small">${esc(e.detalhe||'')}${e.motivo?'<div class="muted">Motivo: '+esc(e.motivo)+'</div>':''}</td><td class="small">${e.antes&&e.depois?Object.keys(e.depois).filter(k=>!['atualizadoEm','prazoDesde','mensagens','notas','encaminhamentos','auditorias','decisoes','tarefas','tentativas','distribuicoes','historicoEtapas','documentos','contratos','pendencias'].includes(k)).slice(0,4).map(k=>`${esc(k)}: ${esc(resumo(e.antes[k]))} → ${esc(resumo(e.depois[k]))}`).join('<br>'):''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhum evento.</p>'; }
  catch(e){ box.innerHTML='<div class="alert bad">Não foi possível carregar a trilha.</div>'; } }
function recsDoCliente(c){ return S.recs.filter(r=>r.id===c.id || r.clienteId===c.id || (r.tipo==='prospect'&&(r.clienteId===c.id||r.clienteExistenteId===c.id))).filter(r=>r.tipo!=='notificacao' && (r.id===c.id || visivel(r))); }
async function carregarTimeline(c){ const box=$('#abaConteudo'); if(!box) return; try { const recs=recsDoCliente(c); const listas=await Promise.all(recs.map(r=>S.store.events(r.id).then(es=>es.map(e=>({...e,_rec:r}))))); const evs=listas.flat().sort((a,b)=>String(b.em).localeCompare(String(a.em)));
  const resp=[...new Set(recs.map(r=>r.responsavelId).filter(Boolean))];
  box.innerHTML = `<div class="alert info">${recs.length} registro(s) deste cliente · ${evs.length} acontecimento(s)${resp.length?' · responsáveis envolvidos: '+esc(resp.map(nomeP).join(', ')):''}.</div>
  <ol class="timeline">${evs.map(e=>`<li><div class="when">${fmtData(e.em)} · ${e.papel==='cliente_site'?'Cliente pelo site':esc(nomeP(e.pessoaId))+' · '+esc(PAPEIS[e.papel]||e.papel)}</div><div><a href="#/r/${e._rec.id}" class="num">${esc(e._rec.numero||TIPO_NOME[e._rec.tipo])}</a> · <b>${esc(String(e.acao).replace(/_/g,' '))}</b>${e.detalhe?' — '+esc(e.detalhe):''}</div>${e.motivo&&e.acao!=='criacao'?`<div class="diff">Motivo: ${esc(e.motivo)}</div>`:''}</li>`).join('')}</ol>`; }
  catch(e){ box.innerHTML='<div class="alert bad">Não foi possível montar a timeline.</div>'; } }

/* ---------- eventos ---------- */
document.addEventListener('click', async ev=>{ const el=ev.target.closest('[data-proximo],[data-autodist],[data-notif],[data-notiftodas],[data-novatarefa],[data-tarefa],#selTodos,.selItem'); if(!el) return; const d=el.dataset;
  try {
    if(el.id==='selTodos'){ document.querySelectorAll('.selItem').forEach(c=>c.checked=el.checked); }
    if(el.id==='selTodos'||el.classList.contains('selItem')){ const n=document.querySelectorAll('.selItem:checked').length; const sc=$('#selCount'); if(sc) sc.textContent=n; return; }
    if(d.proximo){ const r=await pegarProximo(); toast('Você assumiu '+(r.numero||'o caso')); render(); }
    else if(d.autodist){ const n=await distribuirAuto(); toast(n+' item(ns) distribuído(s)'); render(); }
    else if(d.notif){ await abrirNotificacao(d.notif); }
    else if(d.notiftodas){ for(const n of minhasNotificacoes().filter(x=>!x.lida)) await S.store.save({...n,lida:true,lidaEm:agoraISO(),atualizadoEm:agoraISO()}); render(); }
    else if(d.novatarefa) formTarefa();
    else if(d.tarefa){ COMP_TAREFA(get(d.tarefa)); }
  } catch(e){ toast(e.message||String(e)); } });
document.addEventListener('submit', async ev=>{ const f=ev.target; if(!['centralFiltro','centralLote','trilhaFiltro'].includes(f.id)) return; ev.preventDefault();
  try { const fd=new FormData(f);
    if(f.id==='centralFiltro'){ S.aba.cf={grupo:fd.get('grupo'),tipo:fd.get('tipo'),setor:fd.get('setor'),resp:fd.get('resp'),prio:fd.get('prio'),q:fd.get('q')}; render(); }
    if(f.id==='trilhaFiltro'){ S.aba.trq=fd.get('q'); render(); }
    if(f.id==='centralLote'){ const ids=[...document.querySelectorAll('.selItem:checked')].map(c=>c.value); const para=fd.get('para'), motivo=String(fd.get('motivo')||'').trim();
      exigir(ids.length,'Selecione ao menos um item.'); exigir(para,'Escolha para quem atribuir.'); exigir(motivo.length>=3,'Informe o motivo.');
      for(const id of ids){ const r=get(id); if(r && r.responsavelId!==para) await alterar(r,{responsavelId:para},'redistribuicao',{motivo,detalhe:'Para '+nomeP(para)}); }
      toast(ids.length+' item(ns) atribuído(s) a '+nomeP(para)); render(); }
  } catch(e){ toast(e.message||String(e)); } });
</script>

<script>

let SV_DL = null; (async()=>{ try { if(window.claude && typeof window.claude.use==='function') SV_DL = await window.claude.use('downloads'); } catch(e){ SV_DL=null; } })();

  }

/* ---------- origem dos atendimentos (canal) ---------- */
function svOrigens(){ const u=S.sess?.unidadeId; const noEsc=r=>!u||!r.unidadeId||r.unidadeId===u;
  const prs=lista('protocolo').filter(noEsc), lds=lista('lead').filter(noEsc), peds=lista('pedido').filter(p=>noEsc(p)&&p.status!=='cancelado');
  const canalDe=r=>{ const c=r.canal||'Não informado'; return c==='Site'?'Formulário do site':c; };
  const cont={}; const add=(r,k)=>{ const c=canalDe(r); (cont[c] ||= {prot:0,lead:0,venda:0,valor:0})[k]++; };
  prs.forEach(r=>add(r,'prot')); lds.forEach(r=>add(r,'lead'));
  peds.forEach(p=>{ const l=get(p.leadId); const c=canalDe(l||p); const x=(cont[c] ||= {prot:0,lead:0,venda:0,valor:0}); x.venda++; if(p.moeda==='EUR') x.eur=(x.eur||0)+(p.preco||0); else x.valor+=p.preco||0; });
  const ls=Object.entries(cont).sort((a,b)=>(b[1].prot+b[1].lead)-(a[1].prot+a[1].lead)); const max=Math.max(1,...ls.map(([,x])=>x.prot+x.lead));

const svPainelBase = telaPainel; telaPainel = function(){ return svPainelBase() + svOrigens(); };

<script>
"use strict";
/* =====================================================================
   Catálogo comercial (out/2026)
   - Preço independente em R$ (Brasil) e € (Irlanda), sem conversão
   - Código interno, categoria, descrições PT/EN, cobrança, situação
   - Situação: ativo (vende) · rascunho · aguardando parceiro · inativo
   - Importação/atualização em lote por código, sem duplicar
     e sem trocar preço já cadastrado sem autorização
   - Moeda acompanha oportunidade → simulação → proposta → pedido → PDF
   ===================================================================== */
const CAT_COM = ['TriSolution','3TreeUniverse Business','3Tree Music','TriUniverse Travel','Currículos e recrutamento','Tecnologia e IA','Internet e telefonia','Casting, modelos e artistas','Assinaturas e benefícios TriClube'];
const CAT_PREFIXO = {'TriSolution':'TSOL','3TreeUniverse Business':'BIZ','3Tree Music':'MUS','TriUniverse Travel':'TRV','Currículos e recrutamento':'CV','Tecnologia e IA':'TEC','Internet e telefonia':'TEL','Casting, modelos e artistas':'CAS','Assinaturas e benefícios TriClube':'CLB'};
const SIT = {ativo:'Ativo', rascunho:'Rascunho', aguardando_parceiro:'Aguardando parceiro', inativo:'Inativo'};
const SIT_CHIP = {ativo:'ok', rascunho:'', aguardando_parceiro:'warn', inativo:'bad'};
const COBR = {unica:'Única', hora:'Por hora', mensal:'Mensal', por_pessoa:'Por pessoa', por_reserva:'Por reserva', gratuito:'Gratuito'};
const COBR_ANTIGA = {'por pessoa':'por_pessoa','por reserva':'por_reserva','por noite':'unica','por dia':'unica','valor fechado':'unica'};
const MOEDAS = {BRL:'R$ · Brasil', EUR:'€ · Irlanda'};
const sitDe = p => p.status || (p.ativo===false ? 'inativo' : 'ativo');
const cobrDe = p => COBR[p.cobranca] ? p.cobranca : (COBR_ANTIGA[p.cobranca] || (p.cobranca ? 'unica' : ''));
const precoDe = (p, m) => m==='EUR' ? (p.precoEUR ?? null) : (p.precoBRL ?? p.precoBase ?? null);
const custoDe = (p, m) => m==='EUR' ? (p.custoEUR ?? null) : (p.custoBRL ?? p.custoBase ?? null);
function svMoney(n, moeda){ if(n==null || n==='') return 'Preço pendente'; return (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:moeda==='EUR'?'EUR':'BRL'}); }
function mo(r, n){ return svMoney(n, (r&&r.moeda)||'BRL'); }
const precoTxt = (p, m) => { const v=precoDe(p,m); if(v===0 && cobrDe(p)==='gratuito') return 'Gratuito'; return svMoney(v,m); };
const svNumPreco = v => { const s=String(v??'').trim(); if(!s || /pendente|^-$|^—$/i.test(s)) return null; if(/gratuito|free|gr[aá]tis/i.test(s)) return 0;
  const limpo=s.replace(/[R$€\s]/g,''); const n = limpo.includes(',') ? num(limpo) : Math.round(Number(limpo)*100)/100; return Number.isFinite(n) ? n : NaN; };
function proximoCodigo(cat){ const pre=CAT_PREFIXO[cat]||'PRD'; const ns=lista('produto').map(p=>String(p.codigo||'')).filter(c=>c.startsWith(pre+'-')).map(c=>parseInt(c.split('-')[1],10)||0); return pre+'-'+String((Math.max(0,...ns)+1)).padStart(3,'0'); }

/* ---------- tela ---------- */
telaServicos = function(){
  const pode = can('config.editar'); const f = S.aba.svf || 'todos'; const cat = S.aba.svc || '';
  const todos = lista('produto').filter(p=>!p.teste).slice().sort((a,b)=>String(a.categoria||'').localeCompare(String(b.categoria||''),'pt-BR') || String(a.codigo||a.nome).localeCompare(String(b.codigo||b.nome),'pt-BR'));
  const conta = k => todos.filter(p=>k==='todos'||sitDe(p)===k).length;
  let ps = todos.filter(p=>f==='todos'||sitDe(p)===f); if(cat) ps=ps.filter(p=>p.categoria===cat);
  const pend = todos.filter(p=>precoDe(p,'BRL')==null || precoDe(p,'EUR')==null).length;
  const tab = (k,t) => `<button class="${f===k?'on':''}" data-aba="svf:${k}">${t} (${conta(k)})</button>`;
  const linha = p => { const st=sitDe(p);
    return `<tr>
      <td class="num">${esc(p.codigo||'—')}</td>
      <td style="min-width:200px"><b>${esc(p.nome)}</b>${p.categoria?`<div><span class="chip">${esc(p.categoria)}</span></div>`:''}${(p.descricoes?.pt||p.descricao)?`<div class="small muted">${esc(String(p.descricoes?.pt||p.descricao).slice(0,160))}${String(p.descricoes?.pt||p.descricao).length>160?'…':''}</div>`:''}</td>
      <td>${esc(COBR[cobrDe(p)]||'—')}</td>
      <td class="num">${esc(precoTxt(p,'BRL'))}</td>
      <td class="num">${esc(precoTxt(p,'EUR'))}</td>
      <td><span class="chip ${SIT_CHIP[st]}">${esc(SIT[st])}</span></td>
      <td style="white-space:nowrap">${pode?`<div style="display:flex;flex-direction:column;gap:6px"><button class="btn small" data-admin="servico:${p.id}">Editar</button><button class="btn small" data-admin="servicoStatus:${p.id}">Situação</button></div>`:''}</td></tr>`; };
  return `<div class="pagehead"><div><h1>Serviços e produtos</h1><p class="muted">Catálogo comercial com preço independente no Brasil (R$) e na Irlanda (€). Só os <b>ativos</b> aparecem nas oportunidades e nos protocolos.</p></div>
    <div class="actions">${pode?'<button class="btn" data-admin="servicoExportar">Baixar planilha</button><button class="btn" data-admin="servicoImportar">Importar planilha</button><button class="btn primary" data-admin="servico">Cadastrar serviço</button>':''}</div></div>
    <div class="kpis"><div class="kpi"><b>${conta('ativo')}</b><span>Ativos (à venda)</span></div><div class="kpi"><b>${conta('rascunho')}</b><span>Rascunho</span></div><div class="kpi"><b>${conta('aguardando_parceiro')}</b><span>Aguardando parceiro</span></div><div class="kpi"><b>${conta('inativo')}</b><span>Inativos</span></div><div class="kpi"><b style="${pend?'color:var(--warn)':''}">${pend}</b><span>Com preço pendente</span></div></div>
    <div class="tabs">${tab('todos','Todos')}${tab('ativo','Ativos')}${tab('rascunho','Rascunho')}${tab('aguardando_parceiro','Aguardando parceiro')}${tab('inativo','Inativos')}</div>
    <div class="actions" style="margin-bottom:10px"><label class="small" for="svCat">Categoria</label><select id="svCat"><option value="">Todas</option>${CAT_COM.map(c=>`<option${c===cat?' selected':''}>${esc(c)}</option>`).join('')}</select></div>
    ${ps.length?`<div class="tablewrap"><table class="cards"><thead><tr><th>Código</th><th>Serviço</th><th>Cobrança</th><th>Brasil (R$)</th><th>Irlanda (€)</th><th>Situação</th><th></th></tr></thead><tbody>${ps.map(linha).join('')}</tbody></table></div>`
      :`<div class="panel empty">Nenhum serviço com esses filtros.${pode?' Use <b>Cadastrar serviço</b> ou <b>Importar planilha</b>.':''}</div>`}
    <p class="small muted" style="margin-top:10px">Preços em R$ e € são definidos separadamente, sem conversão. "Preço pendente" significa que ainda falta a sua confirmação. O sistema não cobra nem processa pagamentos: ele registra orçamento, pedido e recebimento.</p>`;
};
document.addEventListener('change', ev=>{ if(ev.target.id==='svCat'){ S.aba.svc=ev.target.value; render(); } });

/* ---------- formulário ---------- */
ADMIN.servico = (id) => { exigir(can('config.editar'),'Só o administrador cadastra serviços.'); const p = id ? get(id) : null; const us = lista('unidade');

    {tipo:'select',nome:'unidade',rotulo:'Unidade',obrig:true,valor:p?.unidadeId||'',opcoes:us.map(u=>[u.id,u.nome])},

    {tipo:'textarea',nome:'desc_pt',rotulo:'Descrição comercial (português)',valor:p?.descricoes?.pt||p?.descricao||''},
    {tipo:'textarea',nome:'desc_en',rotulo:'Descrição comercial (inglês)',valor:p?.descricoes?.en||''},
    {tipo:'text',nome:'inclui',rotulo:'O que está incluso',valor:p?.inclui||''},
    {tipo:'textarea',nome:'regras',rotulo:'Regras de entrega e atendimento',valor:p?.regras||'',ajuda:'Prazo, como é entregue, o que o cliente precisa enviar, limites.'},
    {tipo:'textarea',nome:'direitos',rotulo:'Direitos de uso (se houver)',valor:p?.direitos||''},
    {tipo:'text',nome:'preco_brl',rotulo:'Preço no Brasil (R$)',valor:v0(precoDe(p||{},'BRL')),ajuda:'Em branco = Preço pendente. "Gratuito" = sem custo.'},
    {tipo:'text',nome:'preco_eur',rotulo:'Preço na Irlanda (€)',valor:v0(precoDe(p||{},'EUR')),ajuda:'Definido à parte, sem converter do real.'},
    {tipo:'text',nome:'custo_brl',rotulo:'Custo base (R$)',valor:v0(custoDe(p||{},'BRL'))},
    {tipo:'text',nome:'custo_eur',rotulo:'Custo base (€)',valor:v0(custoDe(p||{},'EUR'))},
    {tipo:'select',nome:'cobranca',rotulo:'Tipo de cobrança',obrig:true,valor:cobrDe(p||{})||'unica',vazio:false,opcoes:Object.entries(COBR)},
    {tipo:'text',nome:'prazo',rotulo:'Prazo ou duração',valor:p?.prazo||''},
    {tipo:'select',nome:'status',rotulo:'Situação',obrig:true,valor:p?sitDe(p):'rascunho',vazio:false,opcoes:Object.entries(SIT),ajuda:'Só "Ativo" aparece para a equipe vender.'}];
  if(p) campos.push({tipo:'text',nome:'motivo',rotulo:'Motivo da alteração',obrig:true});
  abrirForm({titulo:p?'Editar serviço':'Cadastrar serviço', sub:p?(p.codigo?p.codigo+' · ':'')+p.nome:'Preço em R$ e € independentes.', campos, ok:p?'Salvar alterações':'Cadastrar',
    onSubmit:async v=>{ exigir(v.mods.length,'Escolha ao menos uma modalidade.');
      const pb=svNumPreco(v.preco_brl), pe=svNumPreco(v.preco_eur), cb=svNumPreco(v.custo_brl), ce=svNumPreco(v.custo_eur);
      exigir(![pb,pe,cb,ce].some(x=>Number.isNaN(x)||(x!=null&&x<0)),'Confira os valores: use números como 1.250,00, deixe em branco ou escreva "Gratuito".');
      exigir(!(v.status==='ativo' && pb==null && pe==null && v.tipo!=='viagem'),'Para ativar, defina o preço em R$ ou em €. (Viagens podem ficar ativas com preço por cotação.)');
      const codigo=(v.codigo||'').trim().toUpperCase() || (p?.codigo) || proximoCodigo(v.categoria);
      exigir(!lista('produto').some(x=>x.id!==p?.id && String(x.codigo||'').toUpperCase()===codigo),'Já existe um serviço com o código '+codigo+'.');
      const dados={codigo, unidadeId:v.unidade, nome:v.nome, categoria:v.categoria, tipoProduto:v.tipo, modalidades:v.mods,
        descricao:v.desc_pt||null, descricoes:{...(p?.descricoes||{}), pt:v.desc_pt||'', en:v.desc_en||''}, nomes:{...(p?.nomes||{}), pt:v.nome},
        inclui:v.inclui||null, regras:v.regras||null, direitos:v.direitos||null, precoBRL:pb, precoEUR:pe, custoBRL:cb, custoEUR:ce, precoBase:pb, custoBase:cb,
        cobranca:v.cobranca, prazo:v.prazo||null, status:v.status, ativo:v.status==='ativo'};
      if(p){ await alterar(p, dados, 'configuracao', {motivo:v.motivo, detalhe:'Serviço editado: '+codigo+' '+v.nome}); return 'Serviço atualizado'; }
      exigir(!lista('produto').some(x=>x.unidadeId===v.unidade && String(x.nome).toLowerCase()===v.nome.toLowerCase()),'Já existe um serviço com esse nome nesta unidade.');
      await criar('produto', dados, 'Serviço cadastrado: '+codigo+' '+v.nome); location.hash='#/servicos'; return 'Serviço '+codigo+' cadastrado'; }});
};
ADMIN.servicoStatus = (id) => { exigir(can('config.editar'),'Só o administrador altera serviços.'); const p=get(id); if(!p) return;
  abrirForm({titulo:'Situação de '+p.nome, sub:'Atual: '+SIT[sitDe(p)]+'. Só "Ativo" aparece para a equipe vender.', campos:[
    {tipo:'select',nome:'st',rotulo:'Nova situação',obrig:true,valor:sitDe(p),vazio:false,opcoes:Object.entries(SIT)},{tipo:'text',nome:'motivo',rotulo:'Motivo',obrig:true}], ok:'Salvar',
    onSubmit:async v=>{ exigir(!(v.st==='ativo' && precoDe(p,'BRL')==null && precoDe(p,'EUR')==null && p.tipoProduto!=='viagem'),'Para ativar, defina antes o preço em R$ ou em €.');
      await alterar(p,{status:v.st,ativo:v.st==='ativo'},'configuracao',{motivo:v.motivo, detalhe:(p.codigo||p.nome)+': '+SIT[v.st]}); return 'Situação: '+SIT[v.st]; }});
};

/* ---------- planilha: exportar e importar em lote ---------- */
const COLS = ['codigo','nome','categoria','unidade','tipo','descricao_pt','descricao_en','preco_brl','preco_eur','custo_brl','custo_eur','cobranca','status','prazo','regras','direitos'];
const csvCel = v => { const s=v==null?'':String(v); return /[;"\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
ADMIN.servicoExportar = async () => {
  const dl = SV_DL; exigir(dl,'Baixar arquivos não está disponível nesta visualização.');
  const n = x => x==null ? '' : String(x).replace('.',',');
  const linhas=[COLS.join(';')].concat(lista('produto').filter(p=>!p.teste).map(p=>[p.codigo||'',p.nome,p.categoria||'',unidade(p.unidadeId)?.codigo||'',p.tipoProduto||'servico',p.descricoes?.pt||p.descricao||'',p.descricoes?.en||'',
    precoDe(p,'BRL')==null?'Preço pendente':n(precoDe(p,'BRL')), precoDe(p,'EUR')==null?'Preço pendente':n(precoDe(p,'EUR')), n(custoDe(p,'BRL')), n(custoDe(p,'EUR')), cobrDe(p), sitDe(p), p.prazo||'', p.regras||'', p.direitos||''].map(csvCel).join(';')));
  try { await dl.save({filename:'catalogo-3treeuniverse.csv', data:'﻿'+linhas.join('\r\n')}); toast('Planilha pronta'); } catch(e){ toast(e?.code==='declined'?'Download cancelado.':'Não foi possível baixar ('+(e?.code||'erro')+').'); }
};
function lerCatalogo(texto){ const rows=parseCSV(texto); exigir(rows.length>=2,'A planilha precisa de cabeçalho e ao menos uma linha.');
  const cab=rows[0].map(c=>norm(c).replace(/\s+/g,'_')); const idx={}; COLS.forEach(k=>{ const i=cab.indexOf(k); if(i>=0) idx[k]=i; });
  exigir(idx.nome!==undefined,'Falta a coluna "nome".'); exigir(idx.categoria!==undefined || idx.codigo!==undefined,'Falta a coluna "categoria" ou "codigo".');
  return rows.slice(1).map((r,i)=>{ const o={_linha:i+2}; for(const [k,j] of Object.entries(idx)) o[k]=String(r[j]??'').trim(); return o; }).filter(o=>o.nome); }
async function importarCatalogo(texto, substituirPrecos, arquivo){
  exigir(can('config.editar'),'Só o administrador importa o catálogo.');
  const linhas=lerCatalogo(texto); const rel={criados:[],atualizados:[],iguais:[],precosMantidos:[],falhas:[]};
  const unidadePor = c => { const u=lista('unidade').find(x=>x.codigo===String(c||'').toUpperCase()||x.id===c||x.nome===c); return u?.id; };
  const unidadePadrao = cat => cat==='TriUniverse Travel' ? unidadePor('TRV') : unidadePor('BIZ');
  for(const l of linhas){ try {
    const cat = CAT_COM.find(c=>norm(c)===norm(l.categoria)) || l.categoria || null;
    const ex = (l.codigo && lista('produto').find(p=>String(p.codigo||'').toUpperCase()===l.codigo.toUpperCase())) || lista('produto').find(p=>!p.teste && norm(p.nome)===norm(l.nome));
    const pb=svNumPreco(l.preco_brl), pe=svNumPreco(l.preco_eur), cb=svNumPreco(l.custo_brl), ce=svNumPreco(l.custo_eur);
    exigir(![pb,pe,cb,ce].some(Number.isNaN),'valor inválido');
    const st = SIT[l.status] ? l.status : (l.status ? (Object.entries(SIT).find(([,t])=>norm(t)===norm(l.status))||[])[0] : null) || (ex?sitDe(ex):'rascunho');
    const cob = COBR[l.cobranca] ? l.cobranca : ((Object.entries(COBR).find(([,t])=>norm(t)===norm(l.cobranca))||[])[0] || (ex?cobrDe(ex):'unica'));
    const tipo = SV_TIPOS[l.tipo] ? l.tipo : (ex?.tipoProduto || (cat==='TriUniverse Travel'?'viagem':'servico'));
    const dados = {nome:l.nome, categoria:cat, tipoProduto:tipo, cobranca:cob, status:st};
    if(l.unidade || !ex) dados.unidadeId = unidadePor(l.unidade) || ex?.unidadeId || unidadePadrao(cat);
    if(!ex) dados.modalidades = [tipo==='viagem'?'viagem':'servico'];
    if(l.descricao_pt) { dados.descricao=l.descricao_pt; } if(l.descricao_pt||l.descricao_en) dados.descricoes={...(ex?.descricoes||{}), ...(l.descricao_pt?{pt:l.descricao_pt}:{}), ...(l.descricao_en?{en:l.descricao_en}:{})};
    for(const k of ['prazo','regras','direitos']) if(l[k]) dados[k]=l[k];
    const preco = (campo, novo, atual) => { if(novo===null && l[campo.replace('preco','preco_').toLowerCase()]===undefined) return; if(atual==null || substituirPrecos || novo===atual) dados[campo]=novo; else if(novo!==atual) rel.precosMantidos.push(`${l.nome}: ${campo==='precoBRL'?'R$':'€'} mantido ${atual} (planilha: ${novo==null?'pendente':novo})`); };
    preco('precoBRL', pb, ex?precoDe(ex,'BRL'):null); preco('precoEUR', pe, ex?precoDe(ex,'EUR'):null);
    if(cb!=null) dados.custoBRL=cb; if(ce!=null) dados.custoEUR=ce;
    if('precoBRL' in dados) dados.precoBase=dados.precoBRL; if('custoBRL' in dados) dados.custoBase=dados.custoBRL;
    const pBRL = 'precoBRL' in dados ? dados.precoBRL : (ex?precoDe(ex,'BRL'):null), pEUR = 'precoEUR' in dados ? dados.precoEUR : (ex?precoDe(ex,'EUR'):null);
    if(dados.status==='ativo' && pBRL==null && pEUR==null && tipo!=='viagem' && !(ex && sitDe(ex)==='ativo')) { dados.status = ex ? sitDe(ex) : 'rascunho'; rel.precosMantidos.push(l.nome+': sem preço, não foi ativado'); }
    dados.ativo = dados.status==='ativo';
    if(ex){ const mud={}; for(const [k,v] of Object.entries(dados)) if(JSON.stringify(ex[k])!==JSON.stringify(v)) mud[k]=v;
      if(!ex.codigo) mud.codigo = (l.codigo||proximoCodigo(cat)).toUpperCase();
      if(!Object.keys(mud).length){ rel.iguais.push(ex.codigo||ex.nome); continue; }
      await alterar(ex, mud, 'configuracao', {motivo:'importação de catálogo'+(arquivo?' ('+arquivo+')':''), detalhe:'Atualizado: '+(mud.codigo||ex.codigo||'')+' '+l.nome}); rel.atualizados.push(mud.codigo||ex.codigo||l.nome); }
    else { dados.codigo=(l.codigo||proximoCodigo(cat)).toUpperCase(); await criar('produto', dados, 'Importação de catálogo: '+dados.codigo+' '+l.nome); rel.criados.push(dados.codigo); }
  } catch(e){ rel.falhas.push('linha '+l._linha+' ('+l.nome+'): '+(e.message||e)); } }
  await criar('importacao',{campanhaId:null, unidadeId:null, arquivo:arquivo||'colado', origemBase:'catálogo de produtos', total:linhas.length, importados:rel.criados.length, atualizados:rel.atualizados.length, iguais:rel.iguais.length, falhas:rel.falhas, precosMantidos:rel.precosMantidos, duplicados:0, naoContatar:0, invalidos:rel.falhas.length, jaClientes:0},'Importação de catálogo');
  return rel; }
ADMIN.servicoImportar = () => { exigir(can('config.editar'),'Só o administrador importa o catálogo.');
  abrirForm({titulo:'Importar planilha de serviços', sub:'Cria o que é novo e atualiza o que já existe pelo código (ou pelo nome). Não duplica.', campos:[
    {tipo:'info',html:'<p class="small">Colunas (separadas por ponto e vírgula): <code>'+COLS.join(';')+'</code>. Dica: use <b>Baixar planilha</b> para ter o modelo já preenchido.</p>'},
    {tipo:'file',nome:'arq',rotulo:'Arquivo CSV'},
    {tipo:'textarea',nome:'txt',rotulo:'Ou cole o conteúdo aqui'},
    {tipo:'checks',nome:'subst',rotulo:'Preços',opcoes:[['sim','Autorizo substituir preços que já estão cadastrados']],ajuda:'Sem marcar, preços existentes são mantidos e listados no resultado.'}], ok:'Importar',
    onSubmit:async v=>{ const f=document.querySelector('#modalForm input[name="arq"]')?.files?.[0]; const texto = f ? await f.text() : v.txt; exigir(texto && texto.trim(),'Escolha um arquivo ou cole a planilha.');
      const r=await importarCatalogo(texto, v.subst.includes('sim'), f?f.name:'colado');
      return `${r.criados.length} criado(s) · ${r.atualizados.length} atualizado(s) · ${r.iguais.length} sem mudança · ${r.precosMantidos.length} preço(s) mantido(s) · ${r.falhas.length} falha(s)`; }});
};

/* ---------- moeda no fluxo comercial ---------- */
function moedaPadrao(prod){ if(!prod) return 'BRL'; return precoDe(prod,'BRL')==null && precoDe(prod,'EUR')!=null ? 'EUR' : 'BRL'; }
function itensIniciais(lead){ const p=produto(lead?.produtoId); if(!p) return undefined; const m=lead.moeda||'BRL'; const v=precoDe(p,m); const c=custoDe(p,m);
  return [{descricao:p.nome+(p.codigo?' ('+p.codigo+')':''), fornecedor:'', custo:c??'', taxas:'', preco:v??''}]; }

</script>

<script>
"use strict";
/* =====================================================================
   Banco online (Supabase) + WhatsApp
   - Se o Netlify tiver SUPABASE_URL e SUPABASE_ANON_KEY, o sistema pede login
     e passa a gravar no Supabase (todos os aparelhos veem os mesmos dados).
   - Sem isso, continua como prévia (dados no navegador).
   ===================================================================== */
const SB_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
async function configOnline(){
  try { const r = await fetch('/.netlify/functions/config', {cache:'no-store'}); if(!r.ok) return null; const c = await r.json(); return c && c.online ? c : null; }
  catch(e){ return null; } }
function carregarScript(src){ return new Promise((ok,erro)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>erro(new Error('Não foi possível carregar '+src)); document.head.appendChild(s); }); }
async function clienteSupabase(c){ if(!window.supabase) await carregarScript(SB_JS); return window.supabase.createClient(c.url, c.anon, {auth:{persistSession:true, autoRefreshToken:true}}); }

function telaLoginOnline(sb){ return new Promise(resolve=>{
  const app=$('#app');
  app.innerHTML = `<div class="gate"><div class="panel"><div class="brand" style="margin-bottom:12px">${LOGO}<span>Sistema V</span></div><h1>Entrar</h1>
    <p class="muted">Use o e-mail e a senha cadastrados no Supabase do Sistema V.</p>
    <form id="sbLogin"><div class="field"><label for="sbe">E-mail</label><input id="sbe" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="sbs">Senha</label><input id="sbs" name="senha" type="password" autocomplete="current-password" required></div>
    <button class="btn primary">Entrar</button><p class="small muted" id="sbMsg" role="status" style="margin-top:10px"></p></form></div></div>`;
  $('#sbLogin').addEventListener('submit', async ev=>{ ev.preventDefault(); const fd=new FormData(ev.target); const msg=$('#sbMsg'); msg.textContent='Entrando…';
    const {data, error} = await sb.auth.signInWithPassword({email:String(fd.get('email')).trim(), password:String(fd.get('senha'))});
    if(error){ msg.textContent='E-mail ou senha incorretos.'; return; } resolve(data.session); });
}); }

function SupaStore(sb){
  const recs = {}; let onChange = ()=>{};
  const emitir = () => onChange(Object.values(recs));
  const chk = ({data, error}) => { if(error) throw new Error(error.message); return data; };
  return {
    modo:'online',
    async init(cb){ onChange=cb;
      for(let de=0;;de+=1000){ const rows = chk(await sb.from('recs').select('data').range(de, de+999)); rows.forEach(x=>{ recs[x.data.id]=x.data; }); if(rows.length<1000) break; }
      emitir();
      sb.channel('recs-ao-vivo').on('postgres_changes',{event:'*',schema:'public',table:'recs'}, p=>{
        if(p.eventType==='DELETE'){ delete recs[p.old.id]; } else if(p.new?.data){ recs[p.new.id]=p.new.data; }
        emitir(); }).subscribe(); },
    async save(rec){ const data=JSON.parse(JSON.stringify(rec)); recs[rec.id]=data; emitir();
      chk(await sb.from('recs').upsert({id:rec.id, tipo:rec.tipo, data, atualizado:new Date().toISOString()})); },
    async addEvent(ev){ chk(await sb.from('ev').insert({id:ev.id, ref:ev.ref, n:ev.n, em:ev.em, data:ev})); },
    async events(ref){ return chk(await sb.from('ev').select('data').eq('ref',ref).order('n')).map(x=>x.data); },
    async recentEvents(n){ return chk(await sb.from('ev').select('data').order('em',{ascending:false}).limit(n)).map(x=>x.data); },
    async nextSeq(chave){ return chk(await sb.rpc('next_seq',{p_chave:chave, p_n:1})); },
    async nextSeqBloco(chave,n){ return chk(await sb.rpc('next_seq',{p_chave:chave, p_n:n})); }
  };
}

/* Copia os dados da prévia (guardados neste navegador) para o banco online. */
async function importarPrevia(){
  const sb=S.sb; exigir(sb,'O banco online não está ativo.');
  let d=null; try { d=JSON.parse(localStorage.getItem('tu_preview_v1')||'null'); } catch(e){}
  exigir(d && Object.keys(d.recs||{}).length, 'Não há dados da prévia neste navegador.');
  const recs=Object.values(d.recs);
  for(let i=0;i<recs.length;i+=200){ const lote=recs.slice(i,i+200).map(r=>({id:r.id, tipo:r.tipo, data:r, atualizado:r.atualizadoEm||new Date().toISOString()}));
    const {error}=await sb.from('recs').upsert(lote); if(error) throw new Error(error.message); }
  const evs=d.ev||[];
  for(let i=0;i<evs.length;i+=200){ const lote=evs.slice(i,i+200).map(e=>({id:e.id, ref:e.ref, n:e.n, em:e.em, data:e}));
    const {error}=await sb.from('ev').upsert(lote,{onConflict:'id', ignoreDuplicates:true}); if(error) throw new Error(error.message); }
  for(const [chave,ult] of Object.entries(d.seq||{})){ const {error}=await sb.rpc('ajustar_seq',{p_chave:chave, p_minimo:ult}); if(error) throw new Error(error.message); }
  return `${recs.length} registros e ${evs.length} eventos copiados para o banco online.`;
}

/* ---------- WhatsApp ---------- */
async function waEnviar(r, texto){
  exigir(S.sb, 'O WhatsApp só funciona com o banco online ativo.');
  const {data:{session}} = await S.sb.auth.getSession(); exigir(session, 'Faça login de novo.');
  const resp = await fetch('/.netlify/functions/whatsapp-enviar',{method:'POST', headers:{'content-type':'application/json', authorization:'Bearer '+session.access_token}, body:JSON.stringify({protocoloId:r.id, texto})});
  const d = await resp.json().catch(()=>({}));
  if(!resp.ok) throw new Error(d.erro || 'Falha ao enviar pelo WhatsApp.');
  return d.waId || null;
}
function waEsperando(){ return lista('protocolo').filter(r=>{ if(!r.wa||!aberto(r)||!visivel(r)) return false; const ms=(r.mensagens||[]).filter(m=>m.visivel); return ms.length && ms[ms.length-1].autor==='cliente'; }).length; }
async function carregarNumerosWA(){ if(!S.sb || S.waNums) return; try { const {data}=await S.sb.from('wa_numeros').select('*').order('rotulo'); S.waNums=data||[]; render(); } catch(e){ S.waNums=[]; } }
function telaWhatsApp(){
  if(S.store?.modo!=='online') return `<h1>WhatsApp</h1><div class="panel"><p>A caixa de entrada do WhatsApp precisa do <b>banco online</b> (Supabase) ativo.</p><p class="muted">Siga o guia <b>ATIVAR-WHATSAPP.md</b> no repositório do Sistema V. Enquanto isso, os protocolos continuam sendo abertos manualmente com o canal "WhatsApp".</p></div>`;
  carregarNumerosWA();
  const nums=S.waNums||[]; const filtro=S.aba.wan||'';
  const ult = r => { const ms=(r.mensagens||[]).filter(m=>m.visivel); return ms[ms.length-1]; };
  const prots = lista('protocolo').filter(r=>r.wa && visivel(r) && (!filtro || r.wa.phoneNumberId===filtro))
    .sort((a,b)=>String(ult(b)?.em||b.atualizadoEm).localeCompare(String(ult(a)?.em||a.atualizadoEm)));
  const esperando = prots.filter(r=>aberto(r) && ult(r)?.autor==='cliente');
  const chip = (id,nome,n) => `<button class="btn small ${filtro===id?'primary':''}" data-aba="wan:${esc(id)}">${esc(nome)}${n!=null?' · '+n:''}</button>`;
  const linha = r => { const m=ult(r); const cli=get(r.clienteId); const espera = aberto(r) && m?.autor==='cliente';
    return `<tr class="link" data-go="#/r/${r.id}"><td>${espera?'<span class="dot" title="Aguardando resposta"></span>':''}${esc(r.numero)}<div class="small muted">${esc(r.wa.rotulo||r.wa.telefoneEmpresa||'')}</div></td>
      <td><b>${esc(cli?.nome || r.wa.nome || '+'+r.wa.contato)}</b><div class="small muted">+${esc(r.wa.contato)}</div></td>
      <td>${m?`<span class="small">${m.autor==='cliente'?'':'<b>Você:</b> '}${esc(String(m.texto).slice(0,90))}</span><div class="small muted">${fmtData(m.em)}</div>`:'—'}</td>
      <td>${chipStatus(r.status)}</td></tr>`; };
  return `<h1>WhatsApp</h1>
    <p class="muted">Todas as conversas dos números ligados ao sistema. Cada conversa nova vira um protocolo 3TU e recebe o número automaticamente. A resposta sai pelo mesmo número que recebeu.</p>
    <div class="row" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">${chip('','Todos os números',prots.length&&!filtro?prots.length:null)}${nums.map(n=>chip(n.phone_number_id, n.rotulo||n.telefone||n.phone_number_id, null)).join('')}</div>
    ${esperando.length?`<div class="alert warn" style="margin-bottom:12px">${esperando.length} conversa(s) aguardando resposta.</div>`:''}
    ${prots.length?`<div class="tablewrap"><table class="cards"><thead><tr><th>Protocolo / número</th><th>Cliente</th><th>Última mensagem</th><th>Status</th></tr></thead><tbody>${prots.map(linha).join('')}</tbody></table></div>`
      :`<div class="panel empty">Nenhuma conversa de WhatsApp ainda.${nums.length?'':' Cadastre os números na tabela <b>wa_numeros</b> do Supabase (veja o guia).'}</div>`}
    <section class="panel" style="margin-top:18px"><h2>Números ligados</h2>${nums.length?`<ul>${nums.map(n=>`<li><b>${esc(n.rotulo)}</b> ${esc(n.telefone||'')} ${n.ativo?'':'<span class="muted">(desativado)</span>'}</li>`).join('')}</ul>`:'<p class="muted">Nenhum número cadastrado ainda.</p>'}
      <p class="small muted">Regra do WhatsApp: texto livre só até 24h depois da última mensagem do cliente.</p>
      ${can('config.editar')?`<p style="margin-top:12px"><button class="btn small" data-svimportar="1">Importar dados da prévia deste navegador</button> <button class="btn small" data-svsaironline="1">Sair da conta online</button></p>`:''}</section>`;
}
document.addEventListener('click', async ev=>{ const el=ev.target.closest('[data-svimportar],[data-svsaironline]'); if(!el) return;
  try { if(el.dataset.svimportar){ if(!confirm('Copiar os dados da prévia deste navegador para o banco online?')) return; toast('Importando…'); toast(await importarPrevia()); }
    else { await S.sb.auth.signOut(); S.sess=null; try{ localStorage.removeItem('tu_sess'); }catch(e){} location.reload(); } }
  catch(e){ toast(e.message||String(e)); } });
</script>

<script>
"use strict";
(async function boot(){
  try { S.sess=JSON.parse(localStorage.getItem('tu_sess')||'null'); } catch(e){ S.sess=null; }
  let agendado=false; const aoMudar = list=>{ indexar(list); if(!agendado){ agendado=true; requestAnimationFrame(()=>{ agendado=false; render(); }); } };
  const online = await configOnline();
  if(online){
    try { const sb = await clienteSupabase(online); let {data:{session}} = await sb.auth.getSession(); if(!session) session = await telaLoginOnline(sb);
      S.sb = sb; S.authEmail = (session.user?.email||'').toLowerCase(); S.store = SupaStore(sb); await S.store.init(aoMudar);
      if(!sessaoValida()){ const p=lista('pessoa').find(x=>x.status==='ativo' && String(x.email||'').toLowerCase()===S.authEmail); const at=p&&atribuicoesDe(p.id)[0]; if(at) await iniciarSessao(p.id, at.papel, at.unidadeId); }
      S.pronto=true; render(); return; }
    catch(e){ toast('Banco online indisponível: '+(e.message||e)+'. Usando a prévia.'); S.sb=null; }
  }
  let db=null; try { if(window.claude && typeof window.claude.use==='function') db = await window.claude.use('db'); } catch(e){ db=null; }
  S.store = db ? DbStore(db) : LocalStore();
  try { await S.store.init(aoMudar); } catch(e){ S.store=LocalStore(); await S.store.init(aoMudar); toast('Sem acesso aos dados compartilhados: usando só este navegador.'); }
  S.pronto=true; render();
})();
</script>
