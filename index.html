<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4;--surface:#FFFFFF;--ink:#15302A;--muted:#5A6B66;--line:#D5DDDA;
  --tree:#1F6B57;--tree-ink:#FFFFFF;--tree-soft:#E2F0EB;
  --warn:#9A5A06;--warn-soft:#FBF0DC;--danger:#B42318;--danger-soft:#FCE9E7;
  --info:#285A86;--info-soft:#E6EEF7;--note:#7A5B00;--note-soft:#FFF6D6;
  --radius:10px;--font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1916;--surface:#15221E;--ink:#E3EDE9;--muted:#9BAEA8;--line:#293A35;
  --tree:#5CBE9C;--tree-ink:#0E1916;--tree-soft:#1B322B;--warn:#E6AB4E;--warn-soft:#352813;
  --danger:#F28B82;--danger-soft:#3A1D1B;--info:#8AB6E0;--info-soft:#1A2A3A;--note:#E8C766;--note-soft:#2F2912;}}
:root[data-theme="dark"]{
  --bg:#0E1916;--surface:#15221E;--ink:#E3EDE9;--muted:#9BAEA8;--line:#293A35;
  --tree:#5CBE9C;--tree-ink:#0E1916;--tree-soft:#1B322B;--warn:#E6AB4E;--warn-soft:#352813;
  --danger:#F28B82;--danger-soft:#3A1D1B;--info:#8AB6E0;--info-soft:#1A2A3A;--note:#E8C766;--note-soft:#2F2912;}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--tree)}
:focus-visible{outline:2px solid var(--tree);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.125rem;font-weight:600}
h3{font-size:.95rem;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand svg{flex:none}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.who{margin-left:auto;display:flex;gap:8px;align-items:center}
.who select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:220px}
.mode{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--note-soft);color:var(--note);white-space:nowrap}
/* estrutura */
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 57px)}
.rail{border-right:1px solid var(--line);padding:14px 10px;background:var(--surface)}
.rail a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);margin-bottom:2px}
.rail a.on{background:var(--tree-soft);font-weight:600}
.rail .count{white-space:nowrap;font-size:.72rem;min-width:22px;text-align:center;padding:1px 6px;border-radius:999px;background:var(--bg);color:var(--muted)}
.rail .count.hot{background:var(--danger-soft);color:var(--danger)}
.rail .sep{height:1px;background:var(--line);margin:10px 4px}
main{padding:20px 24px 96px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.pagehead p{margin:4px 0 0}
/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--tree)}
.btn.primary{background:var(--tree);border-color:var(--tree);color:var(--tree-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.kpi b{display:block;font-size:1.2rem;font-weight:700;line-height:1.2;white-space:nowrap}
.kpi span{font-size:.82rem;color:var(--muted)}
/* tabela */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--bg)}
.num{font-weight:600;white-space:nowrap}
/* chips */
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:500;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--tree-soft);border-color:transparent;color:var(--tree)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.info{background:var(--info-soft);border-color:transparent;color:var(--info)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px}
/* ficha */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:10px 0 14px}
.chain a,.chain span.cur{padding:5px 10px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600;font-size:.85rem;border-radius:6px}
.chain span.cur{background:var(--tree);border-color:var(--tree);color:var(--tree-ink)}
.chain i{width:18px;height:2px;background:var(--line);display:inline-block}
.steps{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 16px}
.step{flex:1 1 96px;overflow-wrap:anywhere;padding:8px 8px 6px;border-top:4px solid var(--line);font-size:.8rem;color:var(--muted)}
.step.done{border-color:var(--tree);color:var(--ink)}
.step.now{border-color:var(--tree);color:var(--ink);font-weight:700;background:var(--tree-soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:.78rem;color:var(--muted)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{border-color:var(--tree);color:var(--ink);font-weight:600}
.msg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.msg.team{background:var(--tree-soft);border-color:transparent}
.msg.note{background:var(--note-soft);border-color:transparent}
.msg header{font-size:.8rem;color:var(--muted);margin-bottom:4px}
.msg p{margin:0;white-space:pre-wrap}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--line);margin-left:6px}
.timeline li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--tree)}
.timeline .when{font-size:.8rem;color:var(--muted)}
.timeline .diff{font-size:.82rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.alert{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:10px}
.alert.bad{background:var(--danger-soft);color:var(--danger)}
.alert.info{background:var(--info-soft);color:var(--info)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* funil */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:120px}
.col h3{display:flex;justify-content:space-between;margin-bottom:8px}
.card{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.card:hover{border-color:var(--tree)}
.card .num{font-size:.85rem}
.bars .bar{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:8px;margin-bottom:6px;font-size:.85rem}
.bars .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--tree);border-radius:6px}
/* modal */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(10,20,18,.45)}
dialog form{display:flex;flex-direction:column;max-height:90vh}
dialog .mh{padding:16px 18px;border-bottom:1px solid var(--line)}
dialog .mb{padding:16px 18px;overflow:auto}
dialog .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.field{margin-bottom:12px}
.field label{display:block;font-size:.85rem;font-weight:500;margin-bottom:4px}
.field input:not([type=checkbox]),.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:76px;resize:vertical}
.field .help{font-size:.78rem;color:var(--muted);margin-top:3px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin-bottom:6px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.formerr{background:var(--danger-soft);color:var(--danger);padding:8px 10px;border-radius:8px;margin-bottom:10px}
.itemrow{border:1px dashed var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw}
/* entrada */
.gate{max-width:560px;margin:48px auto;padding:0 16px}
.gate .panel{padding:22px}
.person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
/* celular */
.bottom{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  main{padding:14px 12px 110px}
  .g2,.g3{grid-template-columns:1fr}
  .top{flex-wrap:wrap;gap:8px}
  .search{order:3;max-width:none;flex-basis:100%}
  .who{margin-left:0;width:100%;flex-wrap:wrap;gap:6px}
  .who select{max-width:44%}
  .who .mode{order:9}
  .brand span{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom a,.bottom button{flex:1;text-align:center;padding:6px 2px;font-size:.8rem;text-decoration:none;color:var(--muted);background:none;border:0}
  .bottom .on{color:var(--tree);font-weight:700}
  table.cards thead{display:none}
  table.cards tr{display:block;border-bottom:1px solid var(--line);padding:8px 4px}
  table.cards td{display:block;border:0;padding:2px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="gate"><div class="panel">Carregando…</div></div></div>
<dialog id="modal"><form method="dialog" id="modalForm"><div class="mh"><h2 id="mTitle"></h2><p class="muted small" id="mSub" style="margin:4px 0 0"></p></div><div class="mb" id="mBody"></div><div class="mf"><button type="button" class="btn" id="mCancel">Cancelar</button><button type="submit" class="btn primary" id="mOk">Salvar</button></div></form></dialog>
<script>
"use strict";
/* =====================================================================
   3TreeUniverse · Sistema interno — preview de teste
   Mesmas regras da migração core (Etapa 0) e do desenho aprovado.
   Dados: banco compartilhado do artifact (db) ou, sem ele, este navegador.
   ===================================================================== */
const PAPEIS = {administrador:'Administrador geral',supervisor:'Supervisor',vendedor:'Atendimento/Vendas',operacional:'Operacional',auditor:'Monitor/Auditoria',
  sac:'SAC',back_office:'Back office',ouvidoria:'Ouvidoria',rh:'RH',financeiro:'Financeiro'};
// papel -> permissão:escopo  (igual a core.papel_permissao)
const PERMS = {
  administrador:'acesso.configurar:todas acesso.atribuir:todas config.editar:todas equipe.ver:todas equipe.editar:todas historico.ver:todas aprovacao.ver:todas aprovacao.decidir:todas cliente.ver:todas lead.ver:todas pedido.ver:todas protocolo.ver:todas painel.ver:todas metas.ver:todas metas.editar:todas',
  supervisor:'equipe.ver:unidade historico.ver:unidade aprovacao.ver:unidade aprovacao.decidir:unidade aprovacao.solicitar:unidade cliente.ver:unidade cliente.editar:unidade lead.ver:unidade lead.criar:unidade lead.editar:unidade simulacao.editar:unidade proposta.editar:unidade desconto.aplicar:unidade venda.confirmar:unidade pedido.ver:unidade execucao.editar:unidade protocolo.ver:unidade protocolo.abrir:unidade protocolo.editar:unidade protocolo.encaminhar:unidade painel.ver:unidade metas.ver:unidade redistribuir.casos:unidade',
  vendedor:'protocolo.ver:proprio protocolo.editar:proprio cliente.ver:unidade cliente.editar:unidade lead.ver:proprio lead.criar:unidade lead.editar:proprio simulacao.editar:proprio proposta.editar:proprio desconto.aplicar:proprio venda.confirmar:proprio pedido.ver:proprio aprovacao.solicitar:proprio protocolo.abrir:unidade historico.ver:proprio',
  auditor:'cliente.ver:unidade lead.ver:unidade pedido.ver:unidade pedido.auditar:unidade protocolo.ver:unidade historico.ver:unidade aprovacao.ver:unidade painel.ver:unidade',
  sac:'cliente.ver:unidade cliente.editar:unidade lead.criar:unidade protocolo.ver:unidade protocolo.abrir:unidade protocolo.editar:unidade protocolo.encaminhar:unidade aprovacao.solicitar:unidade historico.ver:proprio pedido.ver:unidade',
  back_office:'cliente.ver:unidade pedido.ver:unidade execucao.editar:unidade protocolo.ver:unidade protocolo.abrir:unidade protocolo.editar:unidade protocolo.encaminhar:unidade aprovacao.solicitar:unidade externa.preparar:unidade historico.ver:proprio',
  ouvidoria:'cliente.ver:unidade lead.ver:unidade pedido.ver:unidade protocolo.ver:unidade protocolo.editar:unidade protocolo.encaminhar:unidade externa.preparar:unidade aprovacao.solicitar:unidade historico.ver:unidade painel.ver:unidade',
  rh:'equipe.ver:todas equipe.editar:todas',
  financeiro:'cliente.ver:unidade pedido.ver:unidade financeiro.confirmar:unidade reembolso.executar:unidade protocolo.ver:unidade painel.ver:unidade historico.ver:proprio metas.ver:unidade'
};
const PERM = {}; for (const [p,s] of Object.entries(PERMS)) { PERM[p] = {}; s.split(' ').forEach(x => { const [k,e] = x.split(':'); PERM[p][k] = e; }); }
const PERMS_EXTRA = {
  operacional:'cliente.ver:unidade pedido.ver:unidade execucao.editar:unidade protocolo.ver:unidade protocolo.editar:unidade protocolo.encaminhar:unidade aprovacao.solicitar:unidade historico.ver:proprio esteira.editar:unidade',
  supervisor:'esteira.editar:unidade documento.analisar:unidade comissao.ver:unidade prospeccao.gerir:unidade prospeccao.trabalhar:unidade', vendedor:'esteira.editar:proprio comissao.ver:proprio prospeccao.trabalhar:proprio', sac:'esteira.editar:unidade',
  back_office:'esteira.editar:unidade documento.analisar:unidade', ouvidoria:'esteira.editar:unidade', auditor:'documento.analisar:unidade comissao.ver:unidade',
  financeiro:'comissao.ver:unidade comissao.pagar:unidade comissao.ajustar:unidade', administrador:'comissao.ver:todas comissao.ajustar:todas documento.analisar:todas prospeccao.gerir:todas' };
for (const [p,s] of Object.entries(PERMS_EXTRA)) { PERM[p] ||= {}; s.split(' ').forEach(x => { const [k,e] = x.split(':'); PERM[p][k] = e; }); }

const SETORES = {comercial:'Comercial',auditoria:'Auditoria',financeiro:'Financeiro',operacao:'Operação',sac:'SAC',back_office:'Back office',ouvidoria:'Ouvidoria',finalizado:'Finalizado'};
const SETOR_DO_PAPEL = {operacional:['operacao'],vendedor:['comercial'],auditor:['auditoria'],financeiro:['financeiro'],back_office:['operacao','back_office'],sac:['sac'],ouvidoria:['ouvidoria'],supervisor:Object.keys(SETORES),administrador:Object.keys(SETORES),rh:[]};
const PAPEL_DO_SETOR = {comercial:'vendedor',auditoria:'auditor',financeiro:'financeiro',operacao:'operacional',back_office:'back_office',sac:'sac',ouvidoria:'ouvidoria'};
const TIPOS_NUM = {cliente:['CL',false],lead:['LD',true],simulacao:['SM',true],proposta:['PP',true],pedido:['PD',true],protocolo:['3TU',true],externa:['RE',true],aprovacao:['AP',true],os:['OS',true]};
const TIPO_NOME = {cliente:'Cliente',lead:'Oportunidade',simulacao:'Simulação',proposta:'Proposta',pedido:'Pedido',protocolo:'Protocolo',externa:'Reclamação externa',aprovacao:'Aprovação'};
const MOTIVOS = {
  perda_lead:['Preço','Comprou com concorrente','Desistiu','Sem resposta'],
  descarte_lead:['Contato inválido','Duplicado'],
  recusa_proposta:['Preço','Condições de pagamento','Datas','Outro'],
  cancelamento_pedido:['Pedido do cliente','Indisponibilidade do fornecedor','Outro'],
  encaminhamento:['Exige ação do fornecedor','Exige investigação interna','Caso reaberto','Caso sensível','Órgão externo','Prazo do nível vencido'],
  reabertura:['Solução não resolveu','Cliente discorda da solução']
};
const ESTAGIOS_VENDA = [['simulacao','Simulação'],['pre_venda','Pré-venda'],['proposta','Proposta'],['venda','Venda'],['auditoria','Auditoria/Aprovação'],['operacao','Operação'],['pos_venda','Pós-venda'],['finalizado','Finalização']];
const ESTAGIOS_ATEND = [['sac','SAC'],['back_office','Back office'],['ouvidoria','Ouvidoria'],['resolvido','Resolvido'],['finalizado','Finalização']];
const PRAZOS_PADRAO = {lead:2,alta:4,media:24,baixa:48,sac:72,back_office:120,ouvidoria:240,proposta:48,parado:72,aprovacao:24,encerrar:168,auditoria:24,execucao:72};

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const agoraISO = () => new Date().toISOString();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmtData = iso => iso ? new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const fmtDia = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';
const brl = n => (Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => { const n = Number(String(v ?? '').replace(/\./g,'').replace(',','.')); return Number.isFinite(n) ? Math.round(n*100)/100 : 0; };
const horas = h => h*3600e3;
const somaHoras = (iso,h) => new Date(new Date(iso).getTime()+horas(h)).toISOString();
const digitos = s => String(s||'').replace(/\D/g,'');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TAB = uid();

/* ---------- dados proibidos (espelho de core.contem_dado_proibido) ---------- */
function luhn(d){ if(!/^\d{15,19}$/.test(d)) return false; let s=0,dbl=false; for(let i=d.length-1;i>=0;i--){ let x=+d[i]; if(dbl){x*=2; if(x>9)x-=9;} s+=x; dbl=!dbl;} return s%10===0; }
const RE_SENHA=/(senha|password)\s*[:=]\s*\S+/i;
const RE_COD=/(c[oó]digo de (verifica[cç][aã]o|seguran[cç]a|autentica[cç][aã]o|acesso|confirma[cç][aã]o)|token|otp|2fa|cvv|cvc)\s*(e|é|:|=)?\s*\d{3,8}(?![0-9A-Za-zÀ-ÿ_])/i;
function dadoProibido(t){ if(!t) return null; t=String(t); if(RE_SENHA.test(t)) return 'senha'; if(RE_COD.test(t)) return 'código de autenticação';
  for(const m of t.matchAll(/(?:\d[ -]?){14,18}\d/g)) if(luhn(m[0].replace(/\D/g,''))) return 'número de cartão'; return null; }

async function sha256(txt){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }

/* ---------- armazenamento ---------- */
function LocalStore(){
  const K='tu_preview_v1';
  let d; try { d = JSON.parse(localStorage.getItem(K)||'null'); } catch(e){ d=null; }
  d = d || {recs:{},ev:[],seq:{}};
  const persist = () => { try { localStorage.setItem(K, JSON.stringify(d)); } catch(e){ toast('Não foi possível salvar neste navegador.'); } };
  let onChange = ()=>{};
  return {
    modo:'local',
    async init(cb){ onChange=cb; cb(Object.values(d.recs)); },
    async save(rec){ d.recs[rec.id]=JSON.parse(JSON.stringify(rec)); persist(); onChange(Object.values(d.recs)); },
    async addEvent(ev){ d.ev.push(ev); persist(); },
    async events(ref){ return d.ev.filter(e=>e.ref===ref).sort((a,b)=>a.n-b.n); },
    async recentEvents(n){ return d.ev.slice().sort((a,b)=>String(b.em).localeCompare(String(a.em))).slice(0,n); },
    async nextSeq(chave){ d.seq[chave]=(d.seq[chave]||0)+1; persist(); return d.seq[chave]; },
    async nextSeqBloco(chave,n){ const ini=(d.seq[chave]||0)+1; d.seq[chave]=(d.seq[chave]||0)+n; persist(); return ini; }
  };
}
function DbStore(db){
  const recs = {}; const filas = {};
  const enfileirar = (path, fn) => { const p = (filas[path]||Promise.resolve()).then(fn, fn); filas[path]=p.catch(()=>{}); return p; };
  return {
    modo:'compartilhado',
    init(cb){ const cols={rec:{},pros:{},notif:{}}; let pend=3, first=true;
      return new Promise((res,rej)=>{ for(const col of ['rec','pros','notif']){
        db.collection(col).limit(1000).onSnapshot(snap=>{ cols[col]={}; snap.docs.forEach(x=>{ cols[col][x.id]=x.data(); }); for(const k in recs) delete recs[k]; Object.assign(recs, cols.rec, cols.pros, cols.notif);
          if(pend>0 && --pend===0 && first){ first=false; cb(Object.values(recs)); res(); } else if(!first) cb(Object.values(recs)); },
          e=>{ if(first){first=false;rej(e);} else toast('Conexão com os dados interrompida. Recarregue a página.'); }); } }); },
    save(rec){ const data=JSON.parse(JSON.stringify(rec)); const col=rec.tipo==='prospect'?'pros':(rec.tipo==='notificacao'?'notif':'rec'); return enfileirar(col+'/'+rec.id, ()=>db.doc(col+'/'+rec.id).set(data)); },
    addEvent(ev){ return db.doc('ev/'+ev.id).set(ev); },
    async events(ref){ const s = await db.collection('ev').where('ref','==',ref).limit(1000).get(); return s.docs.map(x=>x.data()).sort((a,b)=>a.n-b.n); },
    async recentEvents(n){ const s = await db.collection('ev').orderBy('em','desc').limit(n).get(); return s.docs.map(x=>x.data()); },
    async nextSeq(chave){ const ref=db.doc('seq/'+chave);
      for(let i=0;i<30;i++){ const r = await ref.acquire({holder:TAB, ttlMs:5000});
        if(r.acquired){ const s = await ref.get(); const u = ((s.exists && s.data().ultimo)||0)+1; await ref.set({ultimo:u}); return u; }
        await sleep(250+Math.random()*400); }
      throw new Error('Numeração ocupada; tente de novo.'); },
    async nextSeqBloco(chave,n){ const ref=db.doc('seq/'+chave);
      for(let i=0;i<30;i++){ const r = await ref.acquire({holder:TAB, ttlMs:5000});
        if(r.acquired){ const s = await ref.get(); const ini = ((s.exists && s.data().ultimo)||0)+1; await ref.set({ultimo:ini+n-1}); return ini; }
        await sleep(250+Math.random()*400); }
      throw new Error('Numeração ocupada; tente de novo.'); }
  };
}

function indexar(list){ S.recs=list; S.by={}; list.forEach(r=>{ (S.by[r.tipo] ||= []).push(r); }); }

/* ---------- sessão e permissões (espelho de core.tem_permissao) ---------- */
function atribuicoesDe(pid){ const hoje=new Date().toISOString().slice(0,10); return lista('atribuicao').filter(a=>a.pessoaId===pid && a.inicio<=hoje && (!a.fim || a.fim>=hoje)); }
function sessaoValida(){ const s=S.sess; if(!s) return false; const p=pessoa(s.pessoaId); if(!p || p.status!=='ativo') return false;
  return atribuicoesDe(s.pessoaId).some(a=>a.papel===s.papel && (a.unidadeId||null)===(s.unidadeId||null)); }
function can(perm, rec){ if(!sessaoValida()) return false; const s=S.sess; const nivel=PERM[s.papel]?.[perm]; if(!nivel) return false;
  const u = rec ? (rec.unidadeId||null) : null;
  if(nivel==='todas' && !s.unidadeId) return true;
  const mesma = !u || u===s.unidadeId;
  if(nivel==='todas'||nivel==='unidade') return mesma;
  const dono = rec ? (rec.vendedorId || rec.responsavelId || rec.criadoPor) : null;
  return mesma && (!rec || !dono || dono===s.pessoaId); }
/* ---------- módulos (mesmo cliente e mesmo protocolo central para todos) ---------- */
const MODULOS = {
  atendimentos:{nome:'Atendimentos',status:'ativo'}, vendas:{nome:'Vendas',status:'ativo'}, os:{nome:'Ordens de Serviço',status:'ativo'}, clientes:{nome:'Clientes',status:'ativo'},

  esteira:{nome:'Esteira',status:'ativo'}, comissoes:{nome:'Comissões',status:'ativo'}, chat_interno:{nome:'Chat interno',status:'ativo'}, logbook:{nome:'Log Book',status:'ativo'}, business:{nome:'Business/Benefícios',status:'ativo'}, prospeccao:{nome:'Prospecção',status:'ativo'},
  equipe:{nome:'Equipe/RH',status:'ativo'}, relatorios:{nome:'Relatórios',status:'ativo'}, configuracoes:{nome:'Administração',status:'ativo'} };
const MOD_PADRAO = { supervisor:['atendimentos','vendas','os','clientes','relatorios','esteira','comissoes','chat_interno','logbook','business','prospeccao'], vendedor:['atendimentos','vendas','clientes','esteira','comissoes','chat_interno','logbook','prospeccao'],
  auditor:['atendimentos','vendas','os','clientes','relatorios','esteira','comissoes','chat_interno','logbook'], sac:['atendimentos','clientes','esteira','chat_interno','logbook','business'],
  back_office:['atendimentos','os','clientes','esteira','chat_interno','logbook','business'], operacional:['atendimentos','os','clientes','esteira','chat_interno','logbook'],
  ouvidoria:['atendimentos','vendas','clientes','relatorios','esteira','chat_interno','logbook','business'], financeiro:['atendimentos','vendas','os','clientes','relatorios','comissoes','chat_interno','logbook'], rh:['equipe','chat_interno','logbook'] };
const modulosDoPapel = papel => papel==='administrador' ? Object.keys(MODULOS) : (cfg().modulos?.[papel] || MOD_PADRAO[papel] || []);
const moduloLiberado = m => !m || (!!S.sess && modulosDoPapel(S.sess.papel).includes(m));
const MOD_CATEGORIAS = {
  geral:['Dúvida','Alteração','Cancelamento/Reembolso','Atraso na entrega','Produto com defeito','Cobrança','Reclamação de atendimento','Outro'],
  card:['Solicitação do cartão','Status da solicitação','Segunda via','Bloqueio','Cancelamento','Dúvida'],
  rewards:['Saldo de pontos','Pontos não creditados','Resgate','Validade','Campanha','Dúvida'],
  mobile:['Contratação','Ativação','Portabilidade','SIM/eSIM','Planos','Recarga','Suporte técnico','Bloqueio/perda','Cancelamento'],
  business:['Usar benefício','Elegibilidade','Parceiro','Reclamação de benefício','Dúvida']};
const moduloDoRec = r => r.modulo || ({autorizacao:'business',cliente:'clientes',lead:'vendas',simulacao:'vendas',proposta:'vendas',pedido:'vendas',protocolo:'atendimentos',externa:'atendimentos'})[r.tipo] || null;
const eu = () => S.sess?.pessoaId;
const meusSetores = () => SETOR_DO_PAPEL[S.sess?.papel] || [];
const visivel = r => { if(!S.sess) return false; const s=S.sess; if(r.tipo==='log') return visivelLog(r); if(r.tipo==='prospect') return visivelProspect(r); if(r.tipo==='tarefa') return visivelTarefa(r);
  if(s.unidadeId && r.unidadeId && r.unidadeId!==s.unidadeId) return false;
  const vp = {cliente:'cliente.ver',lead:'lead.ver',simulacao:'lead.ver',proposta:'lead.ver',pedido:'pedido.ver',protocolo:'protocolo.ver',externa:'protocolo.ver',aprovacao:'aprovacao.ver',autorizacao:'protocolo.ver'}[r.tipo];
  if(!vp) return false;
  if(r.tipo==='protocolo' || r.tipo==='externa'){ if(r.modulo ? !moduloLiberado(r.modulo) : !moduloLiberado('atendimentos')) return false; }
  else if(r.tipo==='pedido'){ if(!moduloLiberado('vendas') && !moduloLiberado('os')) return false; }
  else if(r.tipo!=='aprovacao' && !moduloLiberado(moduloDoRec(r))) return false;
  if(r.tipo==='aprovacao' && r.solicitanteId===eu()) return true;
  if(can(vp, r)) return true;
  if(r.responsavelId===eu()) return true;
  if(['lead','simulacao','proposta'].includes(r.tipo) && can('venda.confirmar')) return can('lead.editar', r);
  return false; };

/* ---------- gravação com histórico imutável encadeado ---------- */
async function registrar(rec, acao, {antes=null, depois=null, motivo='', detalhe=''}={}){
  const prev = rec.hist || {n:0, hash:''};
  const site=!!S.modoSite; const ev = {id:uid(), ref:rec.id, tipo:rec.tipo, numero:rec.numero||'', n:prev.n+1, em:agoraISO(), pessoaId:site?null:(eu()||null), papel:site?'cliente_site':(S.sess?.papel||'sistema'),
              unidadeId:rec.unidadeId||null, acao, detalhe, antes, depois, motivo, hashAnterior:prev.hash};
  const evc = JSON.parse(JSON.stringify(ev)); Object.assign(ev, evc);
  ev.hash = await hashEv(ev);
  rec.hist = {n:ev.n, hash:ev.hash};
  await S.store.addEvent(ev);
  return ev;
}
function checarTextos(obj){ for(const [k,v] of Object.entries(obj||{})){ if(typeof v==='string'){ const t=dadoProibido(v); if(t) throw new Error(`Não registre ${t} (campo "${k}"). Use só os 4 últimos dígitos do cartão e o comprovante.`); } else if(v && typeof v==='object') checarTextos(v); } }
async function numerar(tipo){ const [pre,anual]=TIPOS_NUM[tipo]; const ano=new Date().getFullYear(); const seq=await S.store.nextSeq(tipo+'-'+(anual?ano:0)); const s=String(seq).padStart(6,'0'); if(tipo==='protocolo') return `3TU-${ano}-${s}`; return anual ? `${pre}-${String(ano%100).padStart(2,'0')}-${s}` : `${pre}-${s}`; }
async function criar(tipo, dados, detalhe){
  checarTextos(dados);
  const rec = {id:uid(), tipo, criadoEm:agoraISO(), criadoPor:S.modoSite?null:(eu()||null), atualizadoEm:agoraISO(), ...dados};
  if(tipo==='protocolo' && !rec.etapa && (rec.produtoId || rec.modulo==='business')){ rec.etapa='recebido'; rec.etapaDesde=rec.criadoEm; rec.pendencias=[]; rec.documentos=[]; rec.contratos=[]; }
  if(TIPOS_NUM[tipo] && !rec.numero) rec.numero = await numerar(tipo);
  await registrar(rec, 'criacao', {depois:limpo(rec), detalhe:detalhe||('Criado: '+(TIPO_NOME[tipo]||tipo))});
  await S.store.save(rec); return rec;
}
function limpo(r){ const {hist, ...x} = r; return x; }
async function alterar(rec, mudancas, acao, {motivo, detalhe}={}){
  if(!motivo || String(motivo).trim().length<3) throw new Error('Toda alteração precisa de motivo.');
  checarTextos(mudancas); checarTextos({motivo, detalhe});
  const cur = get(rec.id) || rec; const antes={}, depois={};
  for(const [k,v] of Object.entries(mudancas)){ if(JSON.stringify(cur[k])!==JSON.stringify(v)){ antes[k]=cur[k]===undefined?null:cur[k]; depois[k]=v; } }
  const novo = {...cur, ...mudancas, atualizadoEm:agoraISO()};
  await registrar(novo, acao, {antes, depois, motivo, detalhe});
  await S.store.save(novo); if(novo.tipo==='pedido' && typeof posPedido==='function') await posPedido(novo); return novo;
}
function canon(v){ if(Array.isArray(v)) return '['+v.map(canon).join(',')+']'; if(v && typeof v==='object') return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'; return JSON.stringify(v===undefined?null:v); }
const hashEv = e => sha256([e.hashAnterior||'',e.ref,e.n,e.em,e.pessoaId||'',e.papel,e.acao,e.detalhe||'',canon(e.antes??null),canon(e.depois??null),e.motivo||''].join('|'));
async function verificarCadeia(evs){ let prev=''; for(const e of evs){ const h=await hashEv(e);
  if((e.hashAnterior||'')!==prev || h!==e.hash) return e.n; prev=e.hash; } return null; }

/* ---------- apoio ao fluxo ---------- */
const exigir = (cond, msg) => { if(!cond) throw new Error(msg); };

const aberto = r => !['feita','venda','nao_interessado','invalido','nao_respondeu','nao_contatar','proposta_conv','log_resolvido','negada','cancelada','encerrada','paga','estornada','concluido','cancelado','encerrado','perdido','descartado','convertido','finalizada','aprovada','recusada','substituida','aceita','recusada','desconto_negado'].includes(r.status);
function politica(unidadeId, produtoId, papel){
  const regras = lista('politica').filter(p=>p.ativa!==false && (!p.unidadeId||p.unidadeId===unidadeId) && (!p.produtoId||p.produtoId===produtoId) && (!p.papel||p.papel===papel));

  const m = regras.find(p=>p.margemMinimaPct!==null && p.margemMinimaPct!==undefined && p.margemMinimaPct!=='');
  return {limitePct: regras.length ? Number(regras[0].limitePct) : 5, margemMinimaPct: m ? Number(m.margemMinimaPct) : null};
}
function estagioVenda(lead){
  if(!lead) return null;
  if(['perdido','descartado'].includes(lead.status)) return 'perdido';
  const ped = lista('pedido').filter(p=>p.leadId===lead.id && p.status!=='cancelado').sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm))[0];
  if(ped) return ({em_auditoria:'auditoria',devolvido:'auditoria',aprovado:'operacao',em_execucao:'operacao',entregue:'pos_venda',concluido:'finalizado'})[ped.status] || 'venda';
  const props = lista('proposta').filter(p=>p.leadId===lead.id);
  if(props.some(p=>p.status==='aceita')) return 'venda';
  if(props.some(p=>['rascunho','aguardando_aprovacao','enviada','desconto_negado'].includes(p.status))) return 'proposta';
  return lead.fase==='pre_venda' ? 'pre_venda' : 'simulacao';
}
function estagioAtend(pr){ if(pr.status==='encerrado') return 'finalizado'; if(pr.status==='resolvido') return 'resolvido'; return pr.nivel||'sac'; }
function leadDe(r){ if(!r) return null; if(r.tipo==='lead') return r; return r.leadId ? get(r.leadId) : (r.pedidoId ? leadDe(get(r.pedidoId)) : null); }

function alertas(r){ const a=[]; const agora=Date.now();
  if(r.prazo && aberto(r) && !['resolvido'].includes(r.status)){ const p=new Date(r.prazo).getTime(), ini=new Date(r.prazoDesde||r.criadoEm).getTime();
    if(p<agora) a.push(['bad','Prazo vencido em '+fmtData(r.prazo)]); else if((agora-ini)/(p-ini)>=0.8) a.push(['warn','Prazo vencendo: '+fmtData(r.prazo)]); }
  if(aberto(r) && r.tipo!=='aprovacao' && agora-new Date(r.atualizadoEm).getTime()>horas(prazoH('parado'))) a.push(['warn','Parado há mais de '+Math.round(prazoH('parado')/24)+' dias']);
  if(r.tipo==='proposta' && r.status==='enviada' && agora-new Date(r.envio?.em||r.atualizadoEm).getTime()>horas(prazoH('proposta'))) a.push(['warn','Proposta sem retorno do cliente']);
  if(r.tipo==='protocolo' && r.status==='reaberto') a.push([r.reaberturas>=2?'bad':'warn', r.reaberturas>=2?'Segunda reabertura: avalie encaminhar à ouvidoria':'Reclamação reaberta']);
  if(r.tipo==='protocolo' && r.status==='resolvido' && agora-new Date(r.resolvidoEm).getTime()>horas(prazoH('encerrar'))) a.push(['info','Resolvido há 7 dias sem manifestação: pode ser encerrado']);
  if(r.tipo==='protocolo' && aberto(r) && r.nivel!=='ouvidoria' && lista('externa').some(e=>e.protocoloId===r.id)) a.push(['warn','Há reclamação externa: o sistema sugere encaminhar à ouvidoria']);
  if(r.tipo==='protocolo' && aberto(r) && r.status!=='encerrado'){ const vis=(r.mensagens||[]).filter(m=>m.visivel); if(vis.length && vis[vis.length-1].autor==='cliente') a.push(['warn','Cliente aguarda resposta no chat']); }
  if(r.tipo==='externa' && r.prazo && aberto(r) && new Date(r.prazo).getTime()-agora < horas(72)) a.push(['bad','Prazo do órgão em até 3 dias: '+fmtDia(r.prazo)]);
  if(r.tipo==='aprovacao' && r.status==='pendente' && agora-new Date(r.criadoEm).getTime()>horas(prazoH('aprovacao'))) a.push(['warn','Aprovação parada há mais de 1 dia']);
  if(r.tipo==='pedido' && r.novoAceitePendente) a.push(['warn','Preço alterado: falta registrar o novo aceite do cliente']);
  return a; }

/* ---------- aprovações humanas ---------- */
async function pedirAprovacao(tipo, rec, valores, justificativa){
  exigir(can('aprovacao.solicitar', rec) || can('aprovacao.solicitar'), 'Seu papel ativo não pode solicitar aprovação.');
  exigir(justificativa && justificativa.length>=5, 'Explique o motivo da solicitação.');
  const requer=['supervisor'];
  if((tipo==='reembolso' && Number(valores.valor)>2000) || (tipo==='resposta_externa' && ['Procon','Juizado'].includes(valores.orgao))) requer.push('administrador');
  return criar('aprovacao', {unidadeId:rec.unidadeId, tipoAp:tipo, refId:rec.id, refNumero:rec.numero, valores, justificativa, solicitanteId:eu(), papelSolicitante:S.sess.papel,
    requer, decisoes:[], status:'pendente', setor:'aprovacoes', prazo:somaHoras(agoraISO(),prazoH('aprovacao'))}, 'Aprovação solicitada: '+TIPO_AP[tipo]+' em '+rec.numero);
}
const TIPO_AP = {desconto:'Desconto fora do limite',alteracao_preco:'Alteração de preço confirmado',emissao:'Emissão de passagem',contratacao:'Contratação de fornecedor/serviço',
  reembolso:'Reembolso',execucao_sem_pagamento:'Execução sem pagamento confirmado',resposta_externa:'Resposta formal externa'};
async function decidir(ap, decisao, comentario){
  exigir(ap.status==='pendente','Esta aprovação já foi decidida.');
  exigir(ap.solicitanteId!==eu(),'Ninguém aprova a própria solicitação.');
  exigir(can('aprovacao.decidir', ap),'Seu papel ativo não decide aprovações nesta unidade.');
  exigir(!(ap.decisoes||[]).some(d=>d.pessoaId===eu()),'Você já decidiu esta aprovação; a próxima etapa precisa de outra pessoa.');
  const ok=(ap.decisoes||[]).filter(d=>d.decisao==='aprovada').length; const prox=ap.requer[ok];
  exigir(S.sess.papel===prox, `Esta etapa exige o papel ${PAPEIS[prox]}.`);
  const decisoes=[...(ap.decisoes||[]), {papel:S.sess.papel, pessoaId:eu(), decisao, comentario, em:agoraISO()}];
  const status = decisao==='recusada' ? 'recusada' : (decisoes.filter(d=>d.decisao==='aprovada').length===ap.requer.length ? 'aprovada' : 'pendente');
  const novo = await alterar(ap, {decisoes, status}, 'decisao', {motivo:'decisão: '+decisao, detalhe:`${PAPEIS[S.sess.papel]} ${decisao==='aprovada'?'aprovou':'recusou'}${comentario?': '+comentario:''}`});
  if(status!=='pendente') await efeitoAprovacao(novo);
  return status==='pendente' ? 'Aprovado nesta etapa; segue para '+PAPEIS[ap.requer[ok+1]] : (status==='aprovada'?'Aprovação concluída':'Solicitação recusada');
}
async function efeitoAprovacao(ap){ const r=get(ap.refId); if(!r) return; const ok=ap.status==='aprovada'; const m={motivo:'resultado de '+ap.numero, detalhe:(ok?'Aprovado':'Recusado')+' em '+ap.numero};
  if(ap.tipoAp==='desconto') await alterar(r,{status: ok?'rascunho':'desconto_negado'},'aprovacao',m);
  if(ap.tipoAp==='alteracao_preco' && ok){ const preco=Number(ap.valores.novo); await alterar(r,{preco, margem:Math.round((preco-r.custo)*100)/100, novoAceitePendente:true},'aprovacao',m); }
  if(ap.tipoAp==='emissao'||ap.tipoAp==='contratacao') await alterar(r,{emissao:{...r.emissao, status: ok?'aprovada':'negada'}},'aprovacao',m);
  if(ap.tipoAp==='execucao_sem_pagamento') await alterar(r,{excecaoPagamento: ok?'aprovada':'negada'},'aprovacao',m);
  if(ap.tipoAp==='reembolso') await alterar(r,{reembolso:{...r.reembolso, status: ok?'aprovado':'negado'}},'aprovacao',m);
  if(ap.tipoAp==='excecao_beneficio' && ok) await alterar(r,{status:'autorizada',elegivel:true,elegibilidade:r.elegibilidade+' — exceção aprovada em '+ap.numero},'aprovacao',m);
  if(ap.tipoAp==='resposta_externa') await alterar(r,{status: ok?'aprovada_para_envio':'resposta_em_preparo'},'aprovacao',m);
}
function prazoNivel(n){ return somaHoras(agoraISO(), prazoH(n)); }

<script>

/* ---------- componentes ---------- */
const chipStatus = s => { const cls = ['concluido','encerrado','finalizada','aprovado','aprovada','aceita','concluida','convertido','resolvido','respondida','confirmado'].includes(s)?'ok'

  return casosVisiveis().filter(r=>{

function relacionados(r){ if(r.tipo==='prospect'){ const l=r.leadId&&get(r.leadId); return l ? relacionados(l) : [get(r.clienteExistenteId), r].filter(Boolean); } if(r.tipo==='autorizacao'||r.tipo==='log'){ const p=get(r.protocoloId); const base=p?relacionados(p):[get(r.clienteId)].filter(Boolean); return [...base, r].filter((x,i,a)=>x&&a.indexOf(x)===i); } const cli = r.tipo==='cliente'?r:get(r.clienteId); const lead=leadDe(r)||(r.tipo==='protocolo'&&r.pedidoId?leadDe(get(r.pedidoId)):null)||(r.tipo==='externa'?leadDe(get(get(r.protocoloId)?.pedidoId)):null);
  const out=[]; if(cli) out.push(cli); if(lead){ out.push(...lista('prospect').filter(x=>x.leadId===lead.id)); out.push(lead);
    const sims=lista('simulacao').filter(s=>s.leadId===lead.id); const ult={}; sims.forEach(s=>{ if(!ult[s.numero]||s.versao>ult[s.numero].versao) ult[s.numero]=s; }); out.push(...Object.values(ult));
    out.push(...lista('proposta').filter(p=>p.leadId===lead.id)); const peds=lista('pedido').filter(p=>p.leadId===lead.id); out.push(...peds);
    out.push(...lista('protocolo').filter(p=>peds.some(x=>x.id===p.pedidoId))); }
  const orig = lead?.protocoloOrigemId ? get(lead.protocoloOrigemId) : (r.tipo==='protocolo'? r : null);

  if(r.tipo==='protocolo'){ const l2=lista('lead').find(l=>l.protocoloOrigemId===r.id); if(l2 && !lead){ return relacionados(l2).concat(r).filter((x,i,a)=>x&&a.indexOf(x)===i); } }
  if(r.tipo==='simulacao' && !out.includes(r)) out.push(r);

function encs(r){ const e=r.encaminhamentos||[]; if(!e.length) return '<p class="muted">Nenhum encaminhamento.</p>';

async function carregarHistorico(r){ const box=$('#abaConteudo'); if(!box) return;

const resumo = v => v===null||v===undefined ? '—' : (typeof v==='object' ? (v.status||JSON.stringify(v).slice(0,60)) : (STATUS[v]||SETORES[v]||String(v).slice(0,80)));

<script>

const ACAO_SITE = {produto_fisico:['comprar','Comprar'], viagem:['proposta','Solicitar proposta'], servico:['contratar','Contratar serviço'], outro:['proposta','Solicitar proposta']};

function emSite(fn){ return async (...a)=>{ S.modoSite=true; try { return await fn(...a); } finally { S.modoSite=false; } }; }
const solicitarSite = emSite(async (prod, acao, v)=>{
  checarTextos(v); exigir(v.nome && (v.email||v.telefone),'Informe nome e e-mail ou telefone.'); exigir(v.mensagem,'Conte o que você precisa.');

  if(!cli) cli = await criar('cliente',{tipoPessoa:'PF',nome:v.nome,telefone:v.telefone,email:(v.email||'').toLowerCase(),documento:'',cidade:'',consentimento:'sim',unidadeId:null,status:'ativo',origem:'site',idioma:langCliente()},'Cadastro feito pelo site');

  const comercial = !['atendimento','interesse','beneficio'].includes(acao); const mod = v.modulo || null;
  const pr = await criar('protocolo',{clienteId:cli.id, pedidoId:null, unidadeId:uni, produtoId:prod?.id||null, modulo:mod, origem:'site', tipoSolicitacao:acao, canal:'Site',
    assunto:(NOME_ACAO[acao])+(prod?' — '+prod.nome:'')+(mod?' — '+MODULOS[mod].nome:''), categoria: comercial?'Solicitação comercial':(acao==='interesse'?'Lista de interesse':(acao==='beneficio'?'Usar benefício':'Dúvida')), prioridade:'media', descricao:v.mensagem,
    nivel:'sac', setor: comercial?'comercial':'sac', responsavelId:null, status:'aberto', reaberturas:0, encaminhamentos:[],
    mensagens:[{id:uid(),em:agoraISO(),autor:'cliente',canal:'site',texto:v.mensagem,visivel:true}], prazo:somaHoras(agoraISO(),prazoH(comercial?'lead':'media')), prazoDesde:agoraISO()}, 'Protocolo aberto pelo site: '+NOME_ACAO[acao]);
  if(comercial && prod) await criar('lead',{clienteId:cli.id, unidadeId:uni, produtoId:prod.id, canal:'Site', origem:'site · '+NOME_ACAO[acao], protocoloOrigemId:pr.id, responsavelId:null, vendedorId:null,
    status:'novo', fase:'simulacao', setor:'comercial', notas:[], prazo:somaHoras(agoraISO(),prazoH('lead')), prazoDesde:agoraISO()}, 'Oportunidade criada a partir de '+pr.numero);
  portalEntrar(cli.id); location.hash='#/site/p/'+pr.id;
  return tr('toast.protocolo',{n:pr.numero}); });
const enviarCliente = emSite(async (pr, texto)=>{ checarTextos({texto}); exigir(texto.trim(),'Escreva sua mensagem.');
  const mud={mensagens:[...(pr.mensagens||[]),{id:uid(),em:agoraISO(),autor:'cliente',canal:'site',texto,visivel:true}]}; if(pr.status==='aguardando_cliente'){ mud.status='em_analise'; }
  await alterar(pr, mud, 'mensagem_cliente', {motivo:'mensagem do cliente pelo site', detalhe:texto.slice(0,140)}); });
function portalEntrar(cid){ try{ sessionStorage.setItem('tu_portal', cid); }catch(e){} S.portal=cid; }
function portalCliente(){ if(S.portal) return S.portal; try{ S.portal=sessionStorage.getItem('tu_portal'); }catch(e){} return S.portal; }
function etapasCliente(pr){
  const lead=lista('lead').find(l=>l.protocoloOrigemId===pr.id); const ped=lead && lista('pedido').filter(p=>p.leadId===lead.id && p.status!=='cancelado').sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm))[0];
  if(!lead){ const e=['Solicitado','Em atendimento','Concluído']; const i=['encerrado','resolvido'].includes(pr.status)?2:(pr.status==='aberto'?0:1); return {e,i}; }
  const e=['Solicitado','Em atendimento','Aguardando pagamento','Em aprovação','Aprovado','Ordem de Serviço','Em execução','Concluído'];

  return {e,i,os:ped?.os}; }
function siteHeader(){ return `<header class="top"><a class="brand" href="#/site" style="text-decoration:none;color:inherit">${LOGO}<span>3TreeUniverse</span></a><span class="mode">Simulação do site para teste</span>

function telaSite(){ const us=lista('unidade');

function telaMeus(){ const cid=portalCliente(); const cli=cid?get(cid):null;

function formSite(acao, prodId){ if(acao==='interesse') return formInteresse(prodId); const prod=prodId?produto(prodId):null;

async function iniciarSessao(pessoaId, papel, unidadeId){

/* ---------- roteamento e eventos ---------- */
let renderPend=false;
function render(){ const app=$('#app'); if(!S.pronto) return;
  if(document.activeElement && document.activeElement.id==='q'){ renderPend=true; return; }
  S.rota=(location.hash&&location.hash!=='#/'&&location.hash!=='#')?location.hash:'#/dashboard'; const partes=S.rota.slice(2).split('/');
  if(partes[0]==='site'){ app.innerHTML = partes[1]==='meus' ? telaMeus() : partes[1]==='p' ? telaChatCliente(partes[2]) : telaSite(); return; }
  if(!sessaoValida()){ S.sess=null; app.innerHTML=telaEntrada(); return; }
  const t=partes[0]; let c;
  const rota=ROTAS.find(x=>x[0]===t); if(rota && rota[2] && !rotaLiberada(rota)){ app.innerHTML=layout('<div class="panel empty">Este módulo não está liberado para o seu papel. O Administrador geral libera módulos em Configurações.</div>'); return; }
  if(['card','rewards','mobile'].includes(t)) c=telaModulo(t); else if(t==='esteira') c=telaEsteira(); else if(t==='comissoes') c=telaComissoes(); else if(t==='chat') c=telaChatInterno(); else if(t==='logbook') c=telaLogbook(); else if(t==='business') c=telaBusiness(); else if(t==='prospeccao') c=telaProspeccao(); else if(t==='dashboard') c=telaDashboard(); else if(t==='tarefas') c=telaTarefas(); else if(t==='notificacoes') c=telaNotificacoes(); else if(t==='trilha') c=telaTrilha(); else if(t==='atendimento') c=telaCentral(); else if(t==='whatsapp') c=telaWhatsApp(); else if(t==='r') c=telaFicha(partes[1]); else if(t==='funil') c=telaFunil(); else if(t==='clientes') c=telaClientes(); else if(t==='atendimento') c=telaAtendimento();
  else if(t==='auditoria') c=telaSetorPedidos('Auditoria','Nenhum pedido é executado antes de passar por aqui.',r=>['em_auditoria','devolvido'].includes(r.status));
  else if(t==='operacao') c=telaSetorPedidos('Ordens de Serviço','Pedidos aprovados aguardando Ordem de Serviço e Ordens em execução.',r=>['aprovado','em_execucao'].includes(r.status));
  else if(t==='financeiro') c=telaSetorPedidos('Financeiro','Recebimentos a confirmar e reembolsos aprovados.',r=>!['cancelado','concluido'].includes(r.status) && r.pagamento?.status!=='confirmado') + `<h2 style="margin:18px 0 8px">Reembolsos aprovados</h2>${tabelaCasos(casosVisiveis().filter(r=>r.tipo==='protocolo'&&r.reembolso?.status==='aprovado'),'Nenhum reembolso a executar.')}`;
  else if(t==='aprovacoes') c=telaAprovacoes(); else if(t==='painel') c=can('painel.ver')?telaPainel()+relatorioComissoes():semAcesso(); else if(t==='equipe') c=can('equipe.ver')?telaEquipe():semAcesso();
  else if(t==='admin') c=(can('config.editar')||can('acesso.atribuir'))?telaAdmin():semAcesso(); else if(t==='busca') c=telaBusca(); else c=telaFila();
  app.innerHTML=layout(c);
  if(t==='r'){ const r=get(partes[1]); const ab=r&&(S.aba['f'+r.id]||'detalhes'); if(ab==='hist') carregarHistorico(r); if(ab==='timeline') carregarTimeline(r); }
  if(t==='trilha') carregarTrilha();
}
const semAcesso = () => '<div class="panel empty">Seu papel ativo não tem acesso a esta área.</div>';
document.addEventListener('click', async ev=>{ const el=ev.target.closest('[data-novoprotmod],[data-go],[data-act],[data-aba],[data-task],[data-admin],[data-sair],[data-novocli],[data-novoprot],[data-novo],[data-focobusca],[data-entrar],[data-site],[data-portalsair]'); if(!el) return;
  const d=el.dataset;
  try {
    if(d.go){ if(ev.target.closest('a')) return; location.hash=d.go; }
    else if(d.act){ const [id,aid]=d.act.split(':'); const r=get(id); const a=(ACOES[r.tipo]||[]).find(x=>x.id===aid); if(a && a.quando(r)) a.abrir(r); }
    else if(d.aba){ const i=d.aba.lastIndexOf(':'); S.aba[d.aba.slice(0,i)]=d.aba.slice(i+1); render(); }
    else if(d.task){ const [pid,tid]=d.task.split(':'); const p=get(pid); abrirForm({titulo:'Concluir tarefa', campos:[{tipo:'text',nome:'resultado',rotulo:'Resultado',obrig:true}], ok:'Concluir',
      onSubmit:async v=>{ await alterar(p,{tarefas:p.tarefas.map(t=>t.id===tid?{...t,status:'concluida',resultado:v.resultado,concluidaEm:agoraISO(),por:eu()}:t)},'tarefa',{motivo:'tarefa concluída',detalhe:v.resultado}); return 'Tarefa concluída'; }}); }
    else if(d.admin){ const [op,id]=d.admin.split(':'); ADMIN[op]?.(id); }
    else if(d.sair){ S.sess=null; try{ localStorage.removeItem('tu_sess'); }catch(e){} location.hash='#/fila'; render(); }
    else if(d.novocli) formCliente();
    else if(d.novoprot) formProtocolo();
    else if(d.novoprotmod) formProtocolo({modulo:d.novoprotmod});
    else if(d.novo){ if(can('cliente.editar')) formCliente(); else if(can('protocolo.abrir')) formProtocolo(); else toast('Seu papel ativo não cria registros.'); }
    else if(d.focobusca){ $('#q')?.focus(); }
    else if(d.entrar){ const at=atribuicoesDe(d.entrar)[0]; await iniciarSessao(d.entrar, at.papel, at.unidadeId); location.hash='#/fila'; render(); }
    else if(d.site){ const [a,pid]=d.site.split(':'); formSite(a, pid||null); }
    else if(d.portalsair){ S.portal=null; try{ sessionStorage.removeItem('tu_portal'); }catch(e){} render(); }
  } catch(e){ toast(e.message||String(e)); } });
document.addEventListener('change', async ev=>{ if(ev.target.id==='papelAtivo'){ const [p,u]=ev.target.value.split('|'); await iniciarSessao(eu(), p, u||null); location.hash='#/fila'; render(); toast('Papel ativo: '+PAPEIS[p]); } });
document.addEventListener('submit', async ev=>{ const f=ev.target; if(f.id==='modalForm') return; ev.preventDefault();
  try {
    if(f.id==='busca'){ S.q=$('#q').value; $('#q').blur(); location.hash='#/busca'; render(); }
    else if(f.id==='bootstrap'){ const fd=new FormData(f); await bootstrap({nome:fd.get('nome').trim(), email:fd.get('email').trim()}); location.hash='#/admin'; render(); toast('Administrador geral criado. Cadastre produtos e a equipe.'); }
    else if(f.id==='portalLogin'){ const fd=new FormData(f); const p=String(fd.get('p')).trim().toUpperCase(), c=String(fd.get('c')).trim().toLowerCase();
      const pr=lista('protocolo').find(x=>x.numero===p); const cli=pr&&get(pr.clienteId);
      if(!cli || !((cli.email && cli.email===c) || (digitos(c).length>=8 && digitos(cli.telefone)===digitos(c)))) throw new Error(tr('err.contato'));
      portalEntrar(cli.id); location.hash='#/site/meus'; render(); }
    else if(f.id==='chatCli'){ const id=S.rota.split('/')[3]; const pr=get(id); const t=new FormData(f).get('m'); await enviarCliente(pr, String(t)); render(); toast(tr('toast.enviada')); }
  } catch(e){ toast(e.message||String(e)); } });
document.addEventListener('focusout', ev=>{ if(ev.target.id==='q' && renderPend){ renderPend=false; setTimeout(render,0); } });
window.addEventListener('hashchange', ()=>{ window.scrollTo(0,0); render(); });

/* ---------- partida ---------- */
</script>

function tempoNaEtapa(pr){ const h=(Date.now()-new Date(pr.etapaDesde||pr.criadoEm).getTime())/36e5; return h<1?Math.max(1,Math.round(h*60))+' min':(h<48?Math.round(h)+' h':Math.round(h/24)+' dias'); }
function bloqueioAvanco(pr){ const pend=(pr.pendencias||[]).filter(p=>!p.resolvida); if(pend.length) return `${pend.length} pendência(s) aberta(s).`;
  if(pr.etapa==='documentos' || pr.etapa==='conferencia'){ const d=pr.documentos||[]; if(!d.length) return 'Nenhum documento registrado.'; if(pr.etapa==='conferencia' && d.some(x=>x.status!=='aprovado')) return 'Há documentos não aprovados.'; }
  if(pr.etapa==='assinatura' && !(pr.contratos||[]).some(c=>c.status==='assinado')) return 'Nenhum contrato assinado.';
  if(pr.etapa==='contrato' && !(pr.contratos||[]).some(c=>['enviado','visualizado','assinado'].includes(c.status))) return 'Contrato ainda não enviado.';

async function moverEtapa(pr, para, motivo){ const ant=pr.etapa; await alterar(pr,{etapa:para, etapaDesde:agoraISO(), historicoEtapas:[...(pr.historicoEtapas||[]),{de:ant,para,em:agoraISO(),por:eu()||null}]},'esteira',{motivo, detalhe:`Esteira: ${nomeEtapa(ant)} → ${nomeEtapa(para)}`}); }
async function sincronizarEsteira(pr, alvo, motivo){ if(!pr || !pr.etapa) return; const lista2=etapasDe(pr); const iA=lista2.indexOf(pr.etapa); const ordem=ETAPAS.map(e=>e[0]);
  const destino = lista2.find(e=>ordem.indexOf(e)>=ordem.indexOf(alvo)); if(destino && lista2.indexOf(destino)>iA) await moverEtapa(pr, destino, motivo); }

function regraComissao(ped){ const rs=lista('regracom').filter(r=>r.ativa!==false && (!r.unidadeId||r.unidadeId===ped.unidadeId) && (!r.produtoId||r.produtoId===ped.produtoId) && (!r.pessoaId||r.pessoaId===ped.vendedorId) && (!r.campanha||r.campanha===ped.campanha));
  const esp=r=>(r.pessoaId?8:0)+(r.campanha?4:0)+(r.produtoId?2:0)+(r.unidadeId?1:0); rs.sort((a,b)=>esp(b)-esp(a)||String(b.criadoEm).localeCompare(String(a.criadoEm))); return rs[0]||null; }
function calcComissao(ped, regra){ if(!regra) return 0; const base = regra.base==='margem' ? Math.max(0, ped.margem||0) : (ped.preco||0); return Math.round((base*Number(regra.percentual||0)/100 + Number(regra.valorFixo||0))*100)/100; }
function statusComissaoDesejado(ped, atual){ if(atual==='paga' && (ped.status==='cancelado' || ped.pagamento?.status==='reembolsado')) return 'estornada';
  if(['paga','estornada'].includes(atual)) return atual;
  if(ped.status==='cancelado') return ['liberada'].includes(atual)?'estornada':'cancelada';
  if(ped.pagamento?.status==='reembolsado') return 'estornada';
  if(['entregue','concluido'].includes(ped.status) && ped.pagamento?.status==='confirmado') return 'liberada';
  if(ped.pagamento?.status==='confirmado') return 'aguardando_confirmacao'; return 'prevista'; }
async function posPedido(ped){ if(!ped) return;
  const pros=lista('prospect').find(x=>x.leadId===ped.leadId);
  if(pros && ['aprovado','em_execucao','entregue','concluido'].includes(ped.status) && pros.status!=='venda') await alterar(pros,{status:'venda',pedidoId:ped.id,proximoRetorno:null},'venda',{motivo:'venda auditada '+ped.numero,detalhe:'Pedido '+ped.numero+' '+brl(ped.preco)});
  if(['aprovado','em_execucao','entregue','concluido','cancelado'].includes(ped.status) || ped.pagamento?.status==='reembolsado'){
    let c=lista('comissao').find(x=>x.pedidoId===ped.id);
    if(!c && ['aprovado','em_execucao','entregue','concluido'].includes(ped.status)){ const regra=regraComissao(ped);
      await criar('comissao',{pedidoId:ped.id,pedidoNumero:ped.numero,protocoloId:ped.protocoloOrigemId||null,clienteId:ped.clienteId,produtoId:ped.produtoId,unidadeId:ped.unidadeId,vendedorId:ped.vendedorId,valorVenda:ped.preco,
        regraId:regra?.id||null,regraDesc:regra?descRegra(regra):'Sem regra configurada',base:regra?.base||'venda',percentual:regra?Number(regra.percentual):0,valor:calcComissao(ped,regra),status:'prevista',ajustes:[]},'Comissão prevista para '+ped.numero); }
    else if(c){ const st=statusComissaoDesejado(ped,c.status); const mud={}; if(st!==c.status) mud.status=st;
      if(!['paga','estornada','cancelada'].includes(c.status) && !c.ajusteManual && ped.preco!==c.valorVenda){ const regra=regraComissao(ped); mud.valorVenda=ped.preco; mud.valor=calcComissao(ped,regra); }
      if(Object.keys(mud).length) await alterar(c,mud,'comissao',{motivo:'recálculo pelo pedido '+ped.numero, detalhe: mud.status?('Status: '+STATUS[mud.status]):'Valor recalculado'}); } }
  const pr=get(ped.protocoloOrigemId);
  if(pr){ const alvo={em_auditoria:'aprovacao',devolvido:'aprovacao',aprovado:'aprovacao',em_execucao:'execucao',entregue:'concluido',concluido:'concluido'}[ped.status]; if(alvo) await sincronizarEsteira(pr, alvo, 'sincronizado com o pedido '+ped.numero); } }
const descRegra = r => [r.pessoaId?nomeP(r.pessoaId):'', r.produtoId?produto(r.produtoId)?.nome:'', r.campanha?'campanha '+r.campanha:'', r.unidadeId?unidade(r.unidadeId)?.codigo:''].filter(Boolean).join(' · ') + ` — ${r.percentual}% ${r.base==='margem'?'da margem':'da venda'}${Number(r.valorFixo)?' + '+brl(r.valorFixo):''}` || 'Padrão';

function elegibilidade(clienteId, beneficioId){ const ad=lista('adesao').filter(a=>a.clienteId===clienteId && a.status==='ativa');
  if(!ad.length) return {ok:false, motivo:'Cliente sem plano ativo.'};
  for(const a of ad){ const pl=get(a.planoId); if(pl && pl.ativo===false) continue; const item=(pl?.beneficios||[]).find(b=>b.beneficioId===beneficioId); if(!item) continue;
    const ini=new Date(); if(item.periodo==='ano'){ ini.setMonth(0,1); } else ini.setDate(1); ini.setHours(0,0,0,0);
    const usados=lista('autorizacao').filter(x=>x.clienteId===clienteId && x.beneficioId===beneficioId && ['autorizada','enviada_parceiro','utilizada','concluida'].includes(x.status) && new Date(x.criadoEm)>=ini).length;
    if(Number(item.limite)>0 && usados>=Number(item.limite)) return {ok:false, motivo:`Limite do plano ${pl.nome} atingido: ${usados}/${item.limite} por ${item.periodo==='ano'?'ano':'mês'}.`, planoId:pl.id};
    return {ok:true, motivo:`Plano ${pl.nome}: ${usados+1}º uso de ${item.limite||'∞'} por ${item.periodo==='ano'?'ano':'mês'}.`, planoId:pl.id}; }
  return {ok:false, motivo:'O plano do cliente não inclui este benefício.'}; }

function abaConteudo(r, aba){
  if(aba==='detalhes') return (naEsteira(r)?esteiraHTML(r):'') + detalhesExtra(r) + detalhes(r);
  if(aba==='cliente') return chatClienteEquipe(r);
  if(aba==='interno') return chatInternoRec(r);
  if(aba==='docs') return docsHTML(r);
  if(aba==='enc') return encs(r);
  if(aba==='notas') return notas(r);
  return '<p class="muted">Carregando histórico…</p>'; }
function esteiraHTML(r){ const ls=etapasDe(r), i=ls.indexOf(r.etapa); const pend=(r.pendencias||[]);
  return `<section class="panel" style="margin-bottom:14px"><h2>Esteira</h2><div class="steps" style="margin-top:8px">${ls.map((k,j)=>`<div class="step ${j<i?'done':(j===i?'now':'')}">${esc(nomeEtapa(k))}</div>`).join('')}</div>
  <p class="small">Etapa atual: <b>${esc(nomeEtapa(r.etapa))}</b> há ${esc(tempoNaEtapa(r))} · setor ${esc(SETORES[r.setor]||r.setor)} · responsável ${esc(nomeP(r.responsavelId))}${r.prazo?' · prazo '+fmtData(r.prazo):''}</p>
  ${pend.length?`<h3>Pendências</h3><ul class="small">${pend.map(p=>`<li>${p.resolvida?'<s>':''}${esc(p.texto)} <span class="muted">(${esc({cliente:'cliente',equipe:'equipe',parceiro:'parceiro'}[p.resp]||'equipe')})</span>${p.resolvida?'</s>':(can('protocolo.editar',r)?` <button class="btn small" data-pend="${r.id}:${p.id}">Resolver</button>`:'')}</li>`).join('')}</ul>`:'<p class="small muted">Sem pendências.</p>'}</section>`; }
function chatClienteEquipe(r){ const ms=(r.mensagens||[]).filter(m=>m.visivel);
  return `<p class="small muted">${r.wa?'💬 Conversa do WhatsApp · '+esc(r.wa.rotulo||'')+' · +'+esc(r.wa.contato)+'. O que você enviar aqui sai pelo WhatsApp.':'💬 O cliente vê estas mensagens em Meus atendimentos.'}</p>${ms.map(m=>m.autor==='cliente'?`<div class="msg"><header>Cliente · ${esc(m.canal||'site')} · ${fmtData(m.em)}</header><p>${esc(m.texto)}</p></div>`:`<div class="msg team"><header>${m.auto?'Resposta automática':esc(nomeP(m.por))+' ('+esc(PAPEIS[m.papel]||'')+')'} · ${esc(m.canal||'')} · ${fmtData(m.em)}</header><p>${esc(m.texto)}</p></div>`).join('')||'<p class="muted">Nenhuma mensagem.</p>'}
  ${aberto(r)&&r.status!=='encerrado'&&can('protocolo.editar',r)?`<form id="compCliente" data-id="${r.id}" class="panel"><div class="field"><label for="cc">Mensagem ao cliente</label><textarea id="cc" name="m" required></textarea></div><button class="btn primary">${r.wa?'Enviar pelo WhatsApp':'Enviar ao cliente'}</button></form>`:''}`; }
function chatInternoRec(r){ const campo=r.tipo==='protocolo'?'mensagens':'notas'; const ms=(r[campo]||[]).filter(m=>!m.visivel && m.autor!=='cliente');
  return `<p class="small muted">🔒 Só a equipe vê. Nunca aparece para o cliente.</p>${ms.map(m=>`<div class="msg note"><header>${esc(nomeP(m.por))} (${esc(PAPEIS[m.papel]||'')}) · ${fmtData(m.em)}</header><p>${esc(m.texto)}</p></div>`).join('')||'<p class="muted">Nenhuma mensagem interna.</p>'}

function etapasCliente(pr){

  if(lead){ if(['perdido','descartado'].includes(lead.status)) return {e:[tr('e.solicitado'),tr('e.atendimento'),tr('e.encerrado')],i:2};
    const e=['e.solicitado','e.atendimento','e.pagamento','e.aprovacao_em','e.aprovado','e.os','e.execucao','e.concluido'].map(k=>tr(k));
    let i = pr.status==='aberto' && !ped && !lista('simulacao').some(s=>s.leadId===lead.id) ? 0 : 1;
    if(ped){ const pago=ped.pagamento?.status==='confirmado'; if(['entregue','concluido'].includes(ped.status)) i=7; else if(ped.status==='em_execucao') i=6; else if(ped.status==='aprovado') i= pago||ped.excecaoPagamento==='aprovada'?4:2; else i= pago?3:2; }
    return {e,i,os:ped?.os}; }
  if(pr.etapa){ const mapa={recebido:'e.solicitado',cadastro:'e.atendimento',documentos:'e.documentacao',conferencia:'e.documentacao',contrato:'e.contrato',assinatura:'e.contrato',aprovacao:'e.aprovacao',execucao:'e.execucao',concluido:'e.concluido'};
    const ks=[...new Set(etapasDe(pr).map(k=>mapa[k]))]; let i=ks.indexOf(mapa[pr.etapa]); if(['encerrado','resolvido'].includes(pr.status)) i=ks.length-1; return {e:ks.map(k=>tr(k)),i}; }
  const e=[tr('e.solicitado'),tr('e.atendimento'),tr('e.concluido')]; const i=['encerrado','resolvido'].includes(pr.status)?2:(pr.status==='aberto'?0:1); return {e,i}; }

/* ---------- eventos das telas novas ---------- */

      onSubmit:async v=>{ exigir(v.parts.length,'Escolha ao menos um participante.'); const c=await criar('conversa',{titulo:v.titulo,participantes:[eu(),...v.parts],mensagens:[],unidadeId:S.sess.unidadeId||null}); S.aba.conv=c.id; return 'Conversa criada'; }});

      await alterar(r,{[campo]:r[campo].map(x=>x.id===iid?{...x,status:novo,historico:[...(x.historico||[]),{de:x.status,para:novo,em:agoraISO(),por:eu()}]}:x)},tipo==='doc'?'documento':'contrato',{motivo:(tipo==='doc'?'documento ':'contrato ')+lab.toLowerCase(),detalhe:(r[campo].find(x=>x.id===iid)?.nome||r[campo].find(x=>x.id===iid)?.titulo)+': '+lab}); toast('Status: '+lab); render(); }
  } catch(e){ toast(e.message||String(e)); render(); } });

      await alterar(r,mud,'mensagem',{motivo:'mensagem ao cliente',detalhe:txt.slice(0,140)}); toast(r.wa?'Enviada pelo WhatsApp':'Enviada ao cliente'); }

<script>
"use strict";
/* =====================================================================
   Prospecção Ativa / Active Sales — mesmo CRM, mesmo cliente, mesmo
   protocolo 3TU. Campanhas → leads → distribuição → Minha Lista →
   tentativas → follow-up → conversão → venda → comissão.
   Nenhuma chamada ou mensagem é disparada pelo sistema.
   ===================================================================== */
Object.assign(TIPOS_NUM,{prospect:['PS',true]});
Object.assign(TIPO_NOME,{prospect:'Lead de prospecção',campanha:'Campanha',importacao:'Importação de base',dnc:'Não contatar'});
Object.assign(STATUS,{distribuido:'Distribuído',tentativa:'Tentativa de contato',contatado:'Contatado',interessado:'Interessado',follow_up:'Follow-up',proposta:'Proposta',venda:'Venda',
  nao_interessado:'Não interessado',invalido:'Número inválido',nao_respondeu:'Não respondeu',nao_contatar:'Não contatar',ativa:'Ativa',encerrada:'Encerrada'});
CASOS.push('prospect');
const PROS_ABERTOS = ['novo','distribuido','tentativa','contatado','interessado','follow_up'];
const PROS_FIM = ['venda','nao_interessado','invalido','nao_respondeu','nao_contatar'];
const BASES_LEGAIS = ['Consentimento do titular','Legítimo interesse (avaliado)','Relação comercial prévia','Outra (descrever na origem)'];
const RESULTADOS = [['nao_respondeu','Não respondeu / caixa postal'],['contatado','Falou com a pessoa, sem decisão'],['interessado','Interessado'],['follow_up','Pediu retorno depois'],
  ['nao_interessado','Não interessado'],['invalido','Número/contato inválido'],['nao_contatar','Pediu para não ser contatado']];
const MAX_TENTATIVAS = 3;
const PROS_I18N = {en:'Prospecting',pt:'Prospecção',es:'Prospección'};
Object.keys(MENU_I18N).forEach(l=>MENU_I18N[l].prospeccao=PROS_I18N[l]);

const podeGerir = () => can('prospeccao.gerir');
function visivelProspect(r){ const s=S.sess; if(!s || !moduloLiberado('prospeccao')) return false; if(s.papel==='administrador') return true;
  if(s.unidadeId && r.unidadeId && r.unidadeId!==s.unidadeId) return false;
  if(can('prospeccao.gerir',r)) return true; return r.responsavelId===eu(); }
const campanhasVisiveis = () => lista('campanha').filter(c=>S.sess.papel==='administrador' || !S.sess.unidadeId || c.unidadeId===S.sess.unidadeId);
const prospectsVisiveis = () => lista('prospect').filter(visivelProspect);
const naoContatar = (tel,email) => lista('dnc').some(d=>d.ativo!==false && ((tel && d.telefone && digitos(d.telefone)===digitos(tel)) || (email && d.email && d.email===String(email).toLowerCase())));
const clienteExistente = (tel,email) => lista('cliente').find(c=>(tel && digitos(c.telefone) && digitos(c.telefone)===digitos(tel)) || (email && c.email && c.email===String(email).toLowerCase()));
const prospectExistente = (tel,email,ignorar) => lista('prospect').find(p=>p.id!==ignorar && !PROS_FIM.includes(p.status) && p.status!=='proposta' && ((tel && digitos(p.telefone) && digitos(p.telefone)===digitos(tel)) || (email && p.email && p.email===String(email).toLowerCase())));

/* ---------- importação CSV/XLSX ---------- */
function parseCSV(txt){ txt=txt.replace(/^\uFEFF/,''); const prim=txt.split(/\r?\n/)[0]||''; const del=[';',',','\t'].sort((a,b)=>prim.split(b).length-prim.split(a).length)[0];
  const rows=[]; let row=[], cel='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else q=false; } else cel+=ch; }
    else if(ch==='"') q=true; else if(ch===del){ row.push(cel); cel=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(cel); rows.push(row); row=[]; cel=''; } else cel+=ch; }
  if(cel!==''||row.length){ row.push(cel); rows.push(row); } return rows.filter(r=>r.some(c=>c.trim()!=='')); }
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const COLUNAS = {nome:['nome','name','contato','cliente'],empresa:['empresa','company','organizacao','organization'],telefone:['telefone','phone','celular','whatsapp','fone','tel'],email:['email','e-mail','mail'],
  regiao:['regiao','region','cidade','city','uf','estado'],origem:['origem','source','fonte'],notas:['observacoes','observacao','obs','notas','notes'],consentimento:['consentimento','consent','base legal','optin','opt-in']};
function mapearLinhas(rows){ if(rows.length<2) throw new Error('A planilha precisa de cabeçalho e ao menos uma linha.');
  const cab=rows[0].map(norm); const idx={}; for(const [k,al] of Object.entries(COLUNAS)){ const i=cab.findIndex(c=>al.includes(c)); if(i>=0) idx[k]=i; }
  exigir(idx.nome!==undefined,'Não encontrei a coluna de nome (nome/name).'); exigir(idx.telefone!==undefined||idx.email!==undefined,'Preciso de uma coluna de telefone ou e-mail.');
  return rows.slice(1).map(r=>{ const o={}; for(const [k,i] of Object.entries(idx)) o[k]=String(r[i]??'').trim(); return o; }); }
function carregarXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=()=>window.XLSX?res(window.XLSX):rej(); sc.onerror=()=>rej(); document.head.appendChild(sc); })
    .catch(()=>{ throw new Error('Não consegui abrir o leitor de XLSX agora. Salve a planilha como CSV e importe de novo.'); }); }
async function lerArquivo(file){ const nome=file.name.toLowerCase();
  if(nome.endsWith('.xlsx')||nome.endsWith('.xls')){ const X=await carregarXLSX(); const wb=X.read(await file.arrayBuffer(),{type:'array'}); return X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{FS:';'}); }
  return file.text(); }
async function emLotes(itens, n, fn){ for(let i=0;i<itens.length;i+=n) await Promise.all(itens.slice(i,i+n).map(fn)); }
async function importarBase(camp, texto, arquivoNome){
  exigir(podeGerir(),'Só supervisor ou administrador importa bases.'); exigir(camp && camp.status==='ativa','Escolha uma campanha ativa.');
  const linhas=mapearLinhas(parseCSV(texto)); exigir(linhas.length<=500,'No preview, importe até 500 linhas por arquivo.');
  exigir(lista('prospect').length+linhas.length<=1000,'O preview guarda até 1.000 leads. Encerre campanhas antigas ou use a versão real.');
  const r={total:linhas.length,importados:0,duplicados:0,naoContatar:0,invalidos:0,proibidos:0,jaClientes:0}; const ok=[]; const vistos=new Set();
  for(const l of linhas){ const tel=l.telefone, em=(l.email||'').toLowerCase(); const chave=digitos(tel)||em;
    if(!l.nome || (!tel && !em) || (tel && digitos(tel).length<8)){ r.invalidos++; continue; }
    if(Object.values(l).some(v=>dadoProibido(v))){ r.proibidos++; continue; }
    if(naoContatar(tel,em)){ r.naoContatar++; continue; }
    if(vistos.has(chave) || prospectExistente(tel,em)){ r.duplicados++; continue; } vistos.add(chave);
    const cli=clienteExistente(tel,em); if(cli) r.jaClientes++;
    ok.push({...l, email:em, clienteExistenteId:cli?.id||null}); }
  const ano=new Date().getFullYear(); const ini = ok.length ? await S.store.nextSeqBloco('prospect-'+ano, ok.length) : 0;
  await emLotes(ok.map((l,i)=>({l,i})), 8, async ({l,i})=>{ const numero=`PS-${String(ano%100).padStart(2,'0')}-${String(ini+i).padStart(6,'0')}`;
    await criar('prospect',{numero, campanhaId:camp.id, unidadeId:camp.unidadeId, produtoId:camp.produtoId, nome:l.nome, empresa:l.empresa||'', telefone:l.telefone||'', email:l.email||'', regiao:l.regiao||'',
      origem:l.origem||camp.origemBase, baseLegal:l.consentimento||camp.baseLegal, notas:l.notas||'', clienteExistenteId:l.clienteExistenteId, status:'novo', responsavelId:null, setor:'comercial', tentativas:[], notasInternas:[]},'Importado de '+arquivoNome); });
  r.importados=ok.length;
  await criar('importacao',{campanhaId:camp.id, unidadeId:camp.unidadeId, arquivo:arquivoNome, origemBase:camp.origemBase, baseLegal:camp.baseLegal, ...r},'Importação de base: '+arquivoNome);
  return r; }

/* ---------- distribuição ---------- */
async function distribuir(camp, vendedores, limite){ exigir(podeGerir(),'Só supervisor ou administrador distribui leads.'); exigir(vendedores.length,'Escolha ao menos um vendedor.');
  const livres=lista('prospect').filter(p=>p.campanhaId===camp.id && p.status==='novo' && !p.responsavelId); exigir(livres.length,'Não há leads novos sem responsável nesta campanha.');
  const cota={}; vendedores.forEach(v=>cota[v]=0); const plano=[]; let k=0;
  for(const p of livres){ const disp=vendedores.filter(v=>!limite || cota[v]<limite); if(!disp.length) break; const v=disp[k++ % disp.length]; cota[v]++; plano.push([p,v]); }
  await emLotes(plano, 8, ([p,v])=>alterar(p,{responsavelId:v,status:'distribuido',distribuidoEm:agoraISO(),distribuicoes:[...(p.distribuicoes||[]),{para:v,por:eu(),em:agoraISO()}]},'distribuicao',{motivo:'distribuição da campanha '+camp.nome,detalhe:'Para '+nomeP(v)}));
  return plano.length; }
async function redistribuirCarteira(camp, de, para, motivo){ exigir(podeGerir(),'Só supervisor ou administrador redistribui.'); exigir(de!==para,'Escolha pessoas diferentes.');
  const ps=lista('prospect').filter(p=>p.campanhaId===camp.id && p.responsavelId===de && PROS_ABERTOS.includes(p.status)); exigir(ps.length,'Essa pessoa não tem leads abertos nesta campanha.');
  await emLotes(ps, 8, p=>alterar(p,{responsavelId:para,distribuicoes:[...(p.distribuicoes||[]),{de,para,por:eu(),em:agoraISO(),motivo}]},'redistribuicao',{motivo,detalhe:`${nomeP(de)} → ${nomeP(para)}`}));
  return ps.length; }

/* ---------- conversão para o fluxo central ---------- */
async function converterProspect(p, v){ exigir(p.responsavelId===eu() || can('prospeccao.gerir',p),'Só o responsável pelo lead ou o supervisor converte.'); exigir(!p.leadId,'Este lead já foi convertido.');
  const camp=get(p.campanhaId); let cli = (p.clienteExistenteId && get(p.clienteExistenteId)) || clienteExistente(v.telefone, v.email);
  if(!cli){ checarTextos(v); cli=await criar('cliente',{tipoPessoa:p.empresa?'PJ':'PF',nome:v.nome,telefone:v.telefone,email:(v.email||'').toLowerCase(),documento:'',cidade:p.regiao||'',consentimento:'sim',unidadeId:null,status:'ativo',origem:'prospecção · '+(camp?.nome||''),origemBase:p.origem,baseLegal:p.baseLegal,idioma:'pt'},'Cliente criado a partir do lead '+p.numero); }
  const canal = p.tentativas?.length ? p.tentativas[p.tentativas.length-1].canal : 'Telefone';
  const pr=await criar('protocolo',{clienteId:cli.id, pedidoId:null, unidadeId:p.unidadeId, produtoId:v.produto||p.produtoId, origem:'prospeccao', tipoSolicitacao:'proposta', canal,
    assunto:'Prospecção — '+(camp?.nome||''), categoria:'Solicitação comercial', prioridade:'media', descricao:v.interesse, nivel:'sac', setor:'comercial', responsavelId:eu(), status:'em_analise', reaberturas:0, encaminhamentos:[], mensagens:[],
    prazo:somaHoras(agoraISO(),prazoH('lead')), prazoDesde:agoraISO()}, 'Protocolo aberto pela conversão do lead '+p.numero);
  const lead=await criar('lead',{clienteId:cli.id, unidadeId:p.unidadeId, produtoId:v.produto||p.produtoId, canal, origem:'Prospecção · '+(camp?.nome||''), campanha:camp?.nome||null, prospectId:p.id, protocoloOrigemId:pr.id,
    responsavelId:eu(), vendedorId:p.responsavelId||eu(), status:'em_atendimento', fase:'simulacao', setor:'comercial', notas:v.interesse?[{id:uid(),em:agoraISO(),por:eu(),papel:S.sess.papel,texto:v.interesse,visivel:false}]:[], prazo:null}, 'Oportunidade criada a partir do lead '+p.numero);
  await alterar(p,{status:'proposta',clienteId:cli.id,leadId:lead.id,protocoloId:pr.id,convertidoEm:agoraISO()},'conversao',{motivo:'lead convertido',detalhe:`${cli.numero} · ${pr.numero} · ${lead.numero}`});
  return {cli,pr,lead}; }

/* ---------- ações na ficha do lead ---------- */
ACOES.prospect=[
 {id:'tentativa', rotulo:'Registrar contato', quando:r=>PROS_ABERTOS.includes(r.status) && (r.responsavelId===eu() || can('prospeccao.gerir',r)), abrir:r=>{ const dnc=naoContatar(r.telefone,r.email);
   abrirForm({titulo:'Contato com '+r.nome, sub:`${r.telefone||''} ${r.email||''} · tentativa ${(r.tentativas||[]).length+1}. O sistema não liga nem envia mensagens: registre o contato que você fez.`,
    campos:[dnc?{tipo:'info',html:'<div class="alert bad">Este contato está na lista Não contatar.</div>'}:{tipo:'info',html:''},
      {tipo:'select',nome:'canal',rotulo:'Canal',obrig:true,valor:'Telefone',vazio:false,opcoes:optsLista(['Telefone','WhatsApp','E-mail','Presencial'])},{tipo:'text',nome:'contato',rotulo:'Telefone/contato usado',obrig:true,valor:r.telefone||r.email},
      {tipo:'select',nome:'resultado',rotulo:'Resultado',obrig:true,opcoes:RESULTADOS},{tipo:'textarea',nome:'obs',rotulo:'Observação'},
      {tipo:'date',nome:'data',rotulo:'Próxima tentativa / retorno',ajuda:'Obrigatória quando o cliente pede retorno.'},{tipo:'text',nome:'hora',rotulo:'Horário (hh:mm)',valor:'09:00',padrao:'[0-2][0-9]:[0-5][0-9]'}], ok:'Registrar contato',
    onSubmit:async v=>{ exigir(!dnc || v.resultado==='nao_contatar','Contato na lista Não contatar: não registre nova abordagem.');
      exigir(v.resultado!=='follow_up' || v.data,'Informe a data do retorno combinado.');
      const proximo = v.data ? new Date(v.data+'T'+(v.hora||'09:00')+':00').toISOString() : null; const n=(r.tentativas||[]).length+1;
      let st = v.resultado; if(st==='nao_respondeu') st = n>=MAX_TENTATIVAS ? 'nao_respondeu' : 'tentativa';
      const t={id:uid(),em:agoraISO(),por:eu(),canal:v.canal,contato:v.contato,resultado:v.resultado,obs:v.obs,proxima:proximo};
      await alterar(r,{status:st,tentativas:[...(r.tentativas||[]),t],proximoRetorno:PROS_FIM.includes(st)?null:proximo},'contato',{motivo:'tentativa de contato',detalhe:`${v.canal}: ${RESULTADOS.find(x=>x[0]===v.resultado)[1]}${v.obs?' — '+v.obs:''}`});
      if(v.resultado==='nao_contatar' && !dnc) await criar('dnc',{telefone:r.telefone,email:r.email,motivo:'Pedido do titular durante contato',prospectId:r.id,unidadeId:r.unidadeId,ativo:true},'Não contatar: '+r.numero);
      return st==='nao_respondeu' ? `Sem resposta após ${MAX_TENTATIVAS} tentativas` : 'Contato registrado: '+STATUS[st]; }}); }},
 {id:'converter', rotulo:'Converter em cliente e proposta', quando:r=>['contatado','interessado','follow_up'].includes(r.status) && !r.leadId && (r.responsavelId===eu() || can('prospeccao.gerir',r)),
   abrir:r=>{ const ex=r.clienteExistenteId?get(r.clienteExistenteId):clienteExistente(r.telefone,r.email);
   abrirForm({titulo:'Converter '+r.numero, sub:ex?`Já é cliente: ${ex.numero} ${ex.nome}. O cadastro existente será usado, sem duplicar.`:'Cria o cliente com os dados do lead, abre o protocolo 3TU e a oportunidade no funil.',
     campos:[{tipo:'text',nome:'nome',rotulo:'Nome',obrig:true,valor:ex?.nome||r.nome},{tipo:'text',nome:'telefone',rotulo:'Telefone',valor:ex?.telefone||r.telefone},{tipo:'email',nome:'email',rotulo:'E-mail',valor:ex?.email||r.email},

 {id:'redistribuir', rotulo:'Redistribuir lead', quando:r=>PROS_ABERTOS.includes(r.status) && can('prospeccao.gerir',r), abrir:r=>abrirForm({titulo:'Redistribuir '+r.numero, sub:'Responsável atual: '+nomeP(r.responsavelId),
